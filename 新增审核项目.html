
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增审核项目</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
            min-width: 0;
            overflow-x: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .page-width {
            width: 100%;
            max-width: none;
            margin-right: auto;
            margin-left: auto;
            padding-right: clamp(16px, 2.5vw, 40px);
            padding-left: clamp(16px, 2.5vw, 40px);
        }

        .form-section {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            scroll-margin-top: 88px;
        }

        .form-section:hover {
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.1);
        }

        .required::after {
            content: "*";
            color: #dc2626;
            margin-left: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-field label {
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            line-height: 1.4;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            min-height: 36px;
            padding: 7px 10px;
            font-size: 13px;
            line-height: 1.4;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            transition: all 0.2s;
        }

        .form-field input:focus,
        .form-field select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .form-field input:read-only {
            color: #64748b;
            background: #f3f4f6;
            cursor: not-allowed;
        }

        .form-field textarea {
            min-height: 96px;
            resize: vertical;
        }

        .form-field .textarea-tall {
            min-height: 132px;
        }

        .business-panel {
            display: grid;
            gap: 18px;
        }

        .business-items {
            display: grid;
            gap: 16px;
        }

        .business-empty {
            padding: 32px 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            color: #94a3b8;
            background: #f8fafc;
            text-align: center;
            font-size: 13px;
        }

        .reviewer-card {
            display: grid;
            gap: 14px;
            padding: 0;
        }

        .reviewer-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .reviewer-card-title {
            color: #1e293b;
            font-size: 14px;
            font-weight: 700;
        }

        .reviewer-empty {
            padding: 24px 16px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            color: #94a3b8;
            background: #f8fafc;
            text-align: center;
            font-size: 13px;
        }

        .reviewer-modal-content {
            max-width: 900px;
        }

        .reviewer-option-table {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
        }

        .reviewer-option-table th,
        .reviewer-option-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            font-size: 13px;
        }

        .reviewer-option-table th {
            color: #475569;
            background: #f8fafc;
            font-weight: 600;
        }

        .reviewer-option-table tr:last-child td {
            border-bottom: 0;
        }

        .reviewer-option-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }

        .reviewer-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .reviewer-search-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .reviewer-unit-search {
            position: relative;
        }

        .reviewer-unit-suggestions {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            left: 0;
            z-index: 10;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, .12);
        }

        .reviewer-unit-suggestion {
            display: block;
            width: 100%;
            padding: 9px 12px;
            color: #475569;
            font-size: 13px;
            text-align: left;
        }

        .reviewer-unit-suggestion:hover {
            color: #2563eb;
            background: #eff6ff;
        }

        .reviewer-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
        }

        .reviewer-option-card {
            display: grid;
            gap: 8px;
            min-width: 0;
            min-height: 132px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
        }

        .reviewer-option-card:hover {
            border-color: #93c5fd;
            background: #eff6ff;
        }

        .reviewer-option-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reviewer-option-card-name {
            overflow: hidden;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reviewer-option-card-meta {
            overflow-wrap: anywhere;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .reviewer-no-result {
            grid-column: 1 / -1;
            padding: 32px 16px;
            color: #64748b;
            text-align: center;
        }

        .business-item {
            display: grid;
            gap: 16px;
            padding: 18px;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            background: #fff;
        }

        .business-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eef2f7;
        }

        .business-item-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
            font-size: 14px;
            font-weight: 700;
        }

        .business-item-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 999px;
            color: #2563eb;
            background: #dbeafe;
            font-size: 12px;
        }

        .business-readonly-field {
            display: flex;
            align-items: center;
            min-height: 40px;
            padding: 8px 0 4px;
            color: #334155;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .business-remove {
            color: #64748b;
            font-size: 13px;
        }

        .business-remove:hover {
            color: #dc2626;
        }

        .business-pick-row {
            display: grid;
            grid-template-columns: minmax(260px, .8fr) minmax(360px, 1.2fr);
            gap: 16px;
            align-items: end;
        }

        .business-category-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 8px;
        }

        .business-info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px 40px;
        }

        .business-info-field {
            min-width: 0;
        }

        .business-info-field > label {
            display: block;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .category-toggle {
            display: inline-flex;
            width: 100%;
            padding: 4px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f8fafc;
        }

        .category-toggle button {
            flex: 1 1 0;
            min-height: 34px;
            border-radius: 7px;
        }

        .business-summary {
            display: block;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .business-summary .readonly-display {
            min-height: 48px;
            padding: 8px 0 0;
            border: 0;
            background: transparent;
            color: #334155;
            font-size: 14px;
        }

        .business-editor-card > .readonly-display {
            border: 0;
            background: transparent;
            padding: 8px 0 0;
            color: #334155;
            font-size: 14px;
        }

        .business-editor-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 16px;
            align-items: stretch;
        }

        .business-editor-grid.single-editor {
            grid-template-columns: minmax(0, 1fr);
        }

        .business-editor-grid textarea {
            display: block;
            width: 100%;
            height: 100px;
            min-height: 100px;
            max-height: 640px;
            overflow: auto;
            resize: vertical !important;
        }

        .business-editor-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
        }

        .business-editor-card label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .field-help {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 400;
        }

        .readonly-display {
            min-height: 180px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #475569;
            background: #f8fafc;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow: auto;
        }

        .upload-zone {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            background: #eff6ff;
            transition: all .2s ease;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #3b82f6;
            background: #dbeafe;
        }

        .modal {
            opacity: 0;
            visibility: hidden;
            transition: all .2s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            transform: scale(.96);
            transition: all .2s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .business-modal-content {
            max-width: 720px;
            border-radius: 16px;
        }

        .business-modal-header {
            padding: 20px 28px;
        }

        .business-modal-header h3 {
            font-size: 20px;
        }

        .business-modal-close {
            color: #94a3b8;
            font-size: 22px;
        }

        .business-modal-body {
            display: grid;
            gap: 20px;
            padding: 26px 28px 30px;
        }

        .business-modal-body .form-field {
            gap: 10px;
        }

        .business-modal-body .form-field > label {
            color: #475569;
            font-size: 14px;
        }

        .business-modal-body select {
            min-height: 46px;
            padding: 0 14px;
            border-radius: 10px;
            color: #334155;
            font-size: 14px;
        }

        .business-modal-body .category-toggle {
            min-height: 56px;
            padding: 5px;
            border-radius: 12px;
        }

        .business-modal-body .category-toggle button {
            min-height: 44px;
            border-radius: 9px;
            font-size: 16px;
        }

        .business-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 18px 28px;
            border-top: 1px solid #e2e8f0;
        }

        .business-modal-footer button {
            min-width: 78px;
            min-height: 44px;
            border-radius: 10px;
            font-size: 14px;
        }

        .footer-actions {
            position: sticky;
            bottom: 0;
            z-index: 20;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e2e8f0;
        }

        .anchor-nav {
            display: flex;
            align-items: center;
            gap: 28px;
            height: 42px;
            overflow-x: auto;
            border-top: 1px solid #eef2f7;
        }

        .anchor-link {
            display: inline-flex;
            align-items: center;
            height: 42px;
            flex: 0 0 auto;
            border-bottom: 2px solid transparent;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            transition: color .2s ease, border-color .2s ease;
        }

        .anchor-link:hover,
        .anchor-link.active {
            border-bottom-color: #2563eb;
            color: #2563eb;
        }

        .anchor-section {
            scroll-margin-top: 112px;
        }

        @media (max-width: 1024px) {
            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .business-pick-row,
            .business-summary,
            .business-editor-grid,
            .business-info-grid,
            .reviewer-search-grid {
                grid-template-columns: 1fr;
            }

            .reviewer-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .reviewer-search-grid,
            .reviewer-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="text-slate-800 bg-slate-50">
    <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="page-width">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-4">
                    <button onclick="history.back()" class="text-slate-600 hover:text-slate-900 flex items-center gap-2 text-sm transition-colors">
                        <i class="fas fa-arrow-left"></i>
                        <span>返回</span>
                    </button>
                    <div class="h-4 w-px bg-slate-300"></div>
                    <h1 class="text-lg font-bold text-slate-900">新增技术服务/培训项目</h1>
                    <span id="projectTypeBadge" class="px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-700 border border-blue-200">技术服务</span>
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">待提交</span>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="saveDraft()" class="px-3 py-2 border border-slate-300 rounded-lg hover:bg-slate-50 text-sm font-medium text-slate-700 transition-all">
                        <i class="fas fa-save mr-1.5"></i>保存
                    </button>
                    <button type="button" onclick="submitForm()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium shadow-md shadow-blue-200 transition-all active:scale-95">
                        <i class="fas fa-paper-plane mr-1.5"></i>提交
                    </button>
                </div>
            </div>
            <nav class="anchor-nav" aria-label="页面导航">
                <a class="anchor-link active" href="#basicInfo">基本信息</a>
                <a class="anchor-link" href="#businessInfo">业务信息</a>
                <a class="anchor-link" href="#personnelInfo">人员信息</a>
                <a class="anchor-link" href="#attachmentInfo">附件信息</a>
            </nav>
        </div>
    </div>

    <main class="page-width py-6 space-y-6">
        <section id="basicInfo" class="anchor-section form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center gap-2">
                <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">1</div>
                <h2 class="font-semibold text-slate-900">基本信息</h2>
            </div>
            <div class="p-6">
                <div class="form-grid">
                    <div class="form-field">
                        <label class="required">项目编号</label>
                        <input type="text" id="projectNo" value="1100Q20260001" readonly>
                    </div>
                    <div class="form-field">
                        <label class="required">客户名称</label>
                        <input type="search" id="customerName" list="customerOptions" placeholder="输入客户名称检索并选择" autocomplete="off">
                        <datalist id="customerOptions"></datalist>
                    </div>
                    <div class="form-field">
                        <label>统一社会信用代码</label>
                        <input type="text" id="creditCode" readonly placeholder="选择客户后自动带入">
                    </div>
                    <div class="form-field">
                        <label class="required">关键场所机构</label>
                        <input type="search" id="siteOrg" list="orgOptions" placeholder="输入总部或分中心名称检索" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="required">业务来源机构</label>
                        <input type="search" id="sourceOrg" list="orgOptions" placeholder="输入总部或分中心名称检索" autocomplete="off">
                        <datalist id="orgOptions"></datalist>
                    </div>
                    <div class="form-field">
                        <label class="required">计划启动日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-field">
                        <label class="required">计划结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
            </div>
        </section>

        <section id="businessInfo" class="anchor-section form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">2</div>
                    <h2 class="font-semibold text-slate-900">业务信息</h2>
                </div>
                <button type="button" onclick="addBusinessItem()" class="text-blue-600 hover:text-blue-700 text-sm font-medium">
                    <i class="fas fa-plus mr-1"></i>新增业务
                </button>
            </div>
            <div class="p-6">
                <div id="businessItems" class="business-items"></div>
            </div>
        </section>

        <section id="personnelInfo" class="anchor-section form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">3</div>
                <h2 class="font-semibold text-slate-900">人员信息</h2>
                </div>
                <button type="button" onclick="openReviewerModal()" class="text-blue-600 hover:text-blue-700 text-sm font-medium">
                    <i class="fas fa-user-plus mr-1"></i>选择人员
                </button>
            </div>
            <div class="p-6">
                <div class="reviewer-card">
                    <div id="reviewerList"></div>
                </div>
            </div>
        </section>

        <section id="attachmentInfo" class="anchor-section form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">4</div>
                    <h2 class="font-semibold text-slate-900">附件信息</h2>
                </div>
            </div>
            <div class="p-6">
                <label class="upload-zone flex items-center justify-between gap-4 p-5 cursor-pointer" id="uploadZone">
                    <input id="projectFiles" type="file" multiple hidden accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
                    <span class="min-w-0">
                        <span>
                            <span class="block text-sm font-semibold text-slate-900">上传项目附件</span>
                            <span class="block text-xs text-slate-500 mt-1">支持上传 PDF、Word、图片格式，单个文件不超过 20M。</span>
                        </span>
                    </span>
                    <span class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm">选择文件</span>
                </label>

                <div class="mt-4 border border-slate-200 rounded-xl overflow-hidden bg-white">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 text-slate-700">
                            <tr>
                                <th class="px-4 py-3 text-left font-semibold">附件名称</th>
                                <th class="px-4 py-3 text-center font-semibold w-40">上传人</th>
                                <th class="px-4 py-3 text-center font-semibold w-40">上传日期</th>
                                <th class="px-4 py-3 text-center font-semibold w-48">操作</th>
                            </tr>
                        </thead>
                        <tbody id="attachmentBody" class="divide-y divide-slate-100">
                            <tr id="emptyAttachment">
                                <td colspan="4" class="px-4 py-8 text-center text-slate-500">暂无随附单据，请点击选择文件或拖拽文件到上方区域</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <div id="toast" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-2xl z-50 flex items-center gap-2 opacity-0 transition-all duration-300">
        <i class="fas fa-check-circle text-green-400"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <div id="businessModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" onclick="closeBusinessModal(event)">
        <div class="modal-content business-modal-content w-full bg-white shadow-2xl" onclick="event.stopPropagation()">
            <div class="business-modal-header flex items-center justify-between border-b border-slate-200">

    "content": "一、服务依据   \n1.基础标准：TC/CIQA 4-2023《生态原产地产品通用要求》（核心技术依据）、TC/CIQA 6-2023《生态原产地产品保护区通用要求》、SN/T 4756—2017《生态原产地产品保护评定技术规范》（出入境检验检疫行业标准）\n2.管理文件：《生态原产地产品和产品保护区管理办法》、《生态原产地产品和产品保护区评审工作指南》\n3.辅助依据：产品相关法律法规（如环保、质量安全法规）、GB/T 24040-2008/GB/T 24044-2008（生命周期评价标准）、WTO《原产地规则协定》（实质性改变判定标准）\n二、服务周期\n技术服务周期：3-6 个月，证书有效期：3 年\n三、服务等级\n1. 服务等级（按产品类型划分）\n等级\t                适用产品领域\t                                核心特征\n一级(简单)   第一产业（农产品、林产品等）\t原产地属性明确，生态流程简单\n二级(中等)   第三产业（旅游、非遗服务等）\t需结合服务场景与地域文化关联性\n三级(复杂)   第二产业（化工、电子、建材）\t需核查全产业链生态合规（含跨境配件）\n2. 核心难易点\n高难度项：生态合规性证明（全生命周期低碳节能数据）、原产地溯源链完整性（尤其是多环节加工产品）\n中等难度项：区域生态环境质量检测报告、传统工艺与生态标准的融合验证\n基础要求：申请人资质合规（企业 / 政府 / 行业组织均可申请）、产品命名规范（需含地名 / 注册商标 / 产品名三要素）\n四、服务方法\n1.双重认定逻辑：\n◦生态性认定：核查全生命周期（生产 / 加工 / 运输 / 储存）的绿色环保、资源节约属性\n◦原产地认定：验证产品与特定地域的自然 / 人文基因关联性\n2.具体实施手段：\n◦文件评审：审核申请书、生态报告、溯源记录等 10 + 类材料\n◦现场核验：实地核查生产流程、产地环境、管理体系运行情况\n◦综合评定：采用定量（能耗 / 污染物排放数据）+ 定性（工艺先进性 / 社会责任）结合法\n◦证后监督：年度抽查 + 专项核查，动态维护认证有效性\n五、交付物\n1.核心交付物：生态原产地产品保护证书（有效期 3 年）、生态原产地保护产品标志使用权授权文件\n2.辅助交付物：评审报告（含生态 / 原产地双维度评价结论）、公示公告文件（协会官网发布截图）、整改建议清单（如适用）\n3.延伸服务成果：国际互认对接支持（突破绿色贸易壁垒）、区域公共品牌申报指导（如地方政府申请场景）",

    "content": "一、服务依据\n根据标准《GB/T39116智能制造能力成熟度》《GB/T39117智能制造能力成熟度评估方法》开展\n二、服务周期：6-12月\n三、服务等级\n    一级：(规划级)企业应开始对实施智能制造的基础和条件进行规划,能够对核心业务活动(设计、生产、物流、销售、服务)进行流程化管理。\n    二级：(规范级)企业应采用自动化技术、信息技术手段对核心装备和核心业务活动等进行改造和规范,实现单一业务活动的数据共享。\n    三级：(集成级)企业应对装备、系统等开展集成,实现跨业务活动间的数据共享。\n    四级：(优化级)企业应对人员、资源、制造等进行数据挖掘,形成知识、模型等,实现对核心业务活动的精准预测和优化。\n    五级：(引领级)企业应基于模型持续驱动业务活动的优化和创新,实现产业链协同并衍生新的制造模式和商业模式。\n    首次申请评估的企业，原则上从成熟度一级、二级、三级开始申请，达到成熟度三级后满一年的企业，可以申请成熟度四级评估。针对获得工业和信息化部智能制造示范工厂揭榜单位、卓越级智能工厂的企业，首次可直接申请成熟度四级评估。\n四、服务方法\n对企业智能制造现状开展调研评估，确定成熟度等级，按照子域收集答辩材料，准备成熟度申报答辩PPT，提交预评估申请，开展预评估，提交正式评估申请，开展正式评估，提交正式评估记录材料，专家委员会评审，评审通过后发放证书。\n五、交付物\n成熟度申报答辩PPT、申请材料、成熟度评估证书",

    "name": "数据管理能力成熟度（DCMM）",
    "content": "一、服务依据\n《GB/T 36073-2018 数据管理能力成熟度评估模型》\n二、服务等级\n    DCMM模型将组织的数据能力成熟度划分为初始级、受管理级、稳健级、量化管理级和优化级共5个发展等级，帮助组织进行数据管理能力成熟度的评价。\n第1级（初始级）：数据管理依附于单项目需求，被动响应；无统一流程，存在数据孤岛，缺乏跨部门协同机制。\n第2级（受管理级）：建立部门级数据规范，识别数据质量与孤岛问题；初步整合业务系统，但解决方案未系统化。\n第3级（稳健级）：实现企业级数据标准化，建立组织/制度/流程；主动结合业务战略与监管要求实施数据治理。\n第4级（量化管理级）：构建可量化评估体系，数据驱动业务创新；主导行业标准制定，数据成为核心资产竞争力。\n第5级（优化级）：数据驱动企业全流程动态优化，支撑战略决策；建立行业最佳实践，形成生态级数据协同网络。\n三、服务方法\n开展调研确定成熟度等级，准备评估材料，提交评估申请，资料收集解读，开展现场评估，撰写评估报告，提交DCMM专家委员会审核，审核通过后颁发证书。\n四、交付物\n评估申请材料、评估证书",

    "content": "一、服务依据：CMMI模型\n二、服务周期：3-6个月\n三、服务等级\n    CMMI一级：初始级，企业对项目的目标与要做的努力很清晰，项目的目标得以实现。但是由于任务的完成带有很大的偶然性，企业无法保证在实施同类项目的时候仍然能够完成任务。\nCMMI二级：管理级，企业具备一定的项目管理能力，能够遵循预定的计划和流程进行项目实施，具备资源分配、人员职责明确、流程监控和控制等项目管理要素。\n    CMMI三级：定义级，企业能够根据自身的特殊情况以及自己的标准流程，将这套管理体系与流程予以制度化。企业不仅能够在同类的项目上得到成功的实施，在不同类的项目上一样能够得到成功的实施。\n    CMMI四级：量化级，企业的项目管理不仅形成了一种制度，而且要实现数字化的管理。对管理流程要做到量化与数字化。通过量化技术来实现流程的稳定性，实现管理的精度，降低项目实施在质量上的波动。\n    CMMI五级：优化级，企业的项目管理达到了最高的境界。企业要能够充分利用信息资料，对企业在项目实施的过程中可能出现的次品予以预防。能够主动地改善流程，运用新技术，实现流程的优化。\n四、服务方法\n根据企业现有的质量体系、实施过程和效果，以及企业规模、实力、管理需求等因素，评估确定合适的CMMI级别，确定评估组成员，开展CMMI模型基础培训，在CMMI研究院官网进行信息注册，确定评估日期，提交评估申请，开展正式评估，整理所有评估的工作输出物，通过评估系统提交给官方审查，审查通过或者整改通过后颁发证书。\n五、交付物\n评估申请材料、模型培训、认证证书",

    "content": "一、服务依据\nGB/T23001-2017 信息化和工业化融合管理体系要求\n二、服务周期：6-8个月\n三、服务等级\n    A（规范级）:开展了规范级能力建设，支持和优化相关业务范围内的生产经营管理活动，但尚未有效建成支持主营业务范围内关键业务数字化和柔性化运行的新型能力：按照GB/T23001-2017的要求建立了两化融合管理体系，能够规范有效开展职能驱动型的能力打造过程管理。\n    AA（场景级）：聚焦主营业务范围内关键业务场景，建成支持关键业务资源配置效率提升、关键业务活动数字化场景化和柔性化运行的场景级能力：开展了技术使能型的能力打造过程管理，符合GB/T23001-2017标准的要求：主要达成效率提升、成本降低、质量提高等预期价值效益目标。\n    AAA（领域级）：聚焦组织（企业）主营业务领域，建成支持主要业务流程资源高效配置、关键业务集成融合、动态协同和一体化运行的领域级能力：开展了知识驱动型的能力打造过程管理，且支持过程管理动态优化：实现组织整体业务成本降低、效率提升、质量提高等预期价值效益目标，并有效拓展延伸业务。\n    AAAA（平台级）：聚焦组织全员、全要素和全过程，建成支持组织（企业）以及组织（企业）之间资源动态配置、主营业务网络化协同和社会化协作的平台级能力能够按需开展数据驱动型的能力打造过程管理：实现供应链/产业链整体成本降低、效率提升、产品/服务创新、用户连接与赋能等价值效益目标，有条件的组织（企业）培育发展平台级数字业务，开辟业务平台化价值创造新空间。\n    AAAAA（生态级）：聚焦跨组织（企业）、生态合作伙伴、用户等，建成支持智能驱动的生态资源按需精准配置，以及生态合作伙伴间业务智能化、集群化、生态化发展，实现价值开放共创的生态级能力；能够自组织开展智能驱动型的能力打造过程管理。全面实现生态圈用户/生态合作伙伴连接与赋能、数字业务壮大、绿色可持续发展等价值效益目标。\n四、服务方法\n开展企业调研及确定评价等级，建立专门项目工作组，贯标启动，体系文件策划及发布，识别和确定新型能力，开展新型能力策划，新型能力试运行，测评及改进，提交认证申请，协助客户现场迎审，审核通过，颁发认证证书。\n五、交付物\n体系文件材料、认证申请材料、认证证书",

    "content": "课程背景：\n在数字经济浪潮席卷全球的当下，信息过载已成为现代职场的常态。据统计，80%的企业知识工作者每日需处理超过20份文档、分析复杂数据报表，并频繁参与跨部门会议，即便熟练使用Office等基础办公软件，仍需耗费大量时间在重复性、机械性的工作环节。与此同时，生成式AI、智能算法等前沿技术虽已渗透至办公场景，但企业在实际应用中普遍陷入“技术陷阱”：复杂的AI平台操作界面让非技术人员望而却步，简单粗放的提示词导致生成内容与实际需求严重脱节，人机协作缺乏标准化流程，更有甚者仅将AI当作聊天工具，未能挖掘其在文档处理、数据分析、创意设计等核心场景的深度价值。\n本课程直击企业效率提升的关键痛点，以国产领先AI助手DeepSeek为核心，深度融合Word、Excel、PPT等职场高频使用工具，创新性地构建“精准提示词+智能化工作流”双引擎教学体系。助力企业突破效率瓶颈，实现从“人力驱动”到“智能驱动”的生产力质变，让AI真正成为驱动企业降本增效、创新发展的核心引擎。\n课程收益：\n1、效率突破：掌握DeepSeek与Office三件套的深度融合技巧，实现文档撰写、数据处理、PPT制作效率翻倍，每日节省2小时以上重复工作时间。\n2、质量跃升：运用SWIFT雨燕功法优化提示词，确保AI生成内容直接满足企业规范，会议纪要、报告等交付物可用率\n3、技能升级：从基础搜索到复杂数据处理，系统掌握AI文本生成、智能分析、PPT设计四大核心技能，告别低效手动操作。\n4、流程重构：学习“AI+传统工具”标准化工作流，实现会议录音转待办、数据自动清洗等场景的自动化处理，减少人为失误。\n5、协作提效：打破人机协作壁垒，通过智能体辅助、多工具协同，推动跨部门协作效率提升，加速项目落地周期。\n课程时间：2天，6小时/天\n课程对象：企业全员\n课程方式：理论讲解+讲师实操演示+讲师实时指导的学员实操\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "name": "《AI助力新媒体制作》",
    "content": "课程背景：\n新媒体运营已经成为很多企业的标配，承担品牌宣传、获客、客户关系管理甚至直接销售转化的重要智能。但当前企业新媒体运营面临多重挑战：\n内容产能瓶颈：高频次、高质量的内容需求与有限人力之间的矛盾日益突出。\n同质化竞争：传统创作模式难以突破“跟风模仿”困境，缺乏差异化创新。\n热点响应滞后：人工追热点的效率难以匹配社交媒体话题的瞬时爆发特性。\n人才困局：企业普遍希望引入高水平的新媒体运营人才，但这样的人才成本高，招聘难留存难。绝大多数企业的新媒体运营团队必须面对一个人才问题：本企业招不到优秀的新媒体运营人才，但仍然希望将新媒体运营工作做好。\nAI困境：新媒体团队普遍知道AI对新媒体运营的重大价值，但对如何系统用好、用足AI工具，普遍缺乏系统认识和实践。通常是部分人员自己尝试着初步使用一些AI工具，远远没有发挥AI在新媒体运营中的巨大潜力。\n生成式AI的成熟为破局提供了全新可能：从图文创作、短视频制作到全渠道内容分发，AI正重新定义新媒体运营的“人机协作”范式。\n本课程通过“工具实战+流程重构+组织升级”三维赋能，帮助企业构建AI驱动的新媒体运营体系，实现内容效率与创意的双提升。\n课程收益：\n1、全链路效率革新：深度掌握文本、图片、视频等多类型AI工具，结合SWIFT高效创作体系与标准化流程，彻底打通新媒体内容从选题、创作到发布的全链路，大幅提升整体运营效率。\n2、差异化爆款突围：借助AI拆解热门内容底层逻辑，融入品牌特色进行创新重构，精准匹配各平台用户偏好，持续产出兼具传播力与品牌调性的优质内容，摆脱同质化竞争困境。\n3、热点极速响应：构建AI驱动的热点监测与创作闭环，实现热点内容从捕捉、分析到成品发布的无缝衔接，显著缩短热点响应周期，快速抢占流量高地。\n4、精细化粉丝运营：运用AI定制个性化粉丝互动策略，基于账号风格与用户需求生成精准回复话术，有效激活粉丝活跃度，提升内容二次传播与用户转化效果。\n5、组织智能升级：重新定义AI时代新媒体团队架构与工作模式，明确各岗位能力要求与协作流程，打造敏捷高效的智能运营体系，降低对高水平人才的依赖，增强团队可持续发展能力。\n课程时间：2-3天，6小时/天\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "content": "课程背景：\n在数字经济浪潮下，财务部门正面临前所未有的挑战：海量票据处理耗时费力、人工核算易错率高、战略分析依赖经验判断、合规审计风险难追溯，传统工作模式已难以适应企业降本增效与数字化转型的需求。与此同时，AI技术的突破为财务工作范式革新提供了新机遇——从发票自动识别到现金流智能预测，从风险动态预警到战略建模分析，AI正在重构财务全流程价值链。然而，企业在落地AI工具时普遍面临三大难题：场景碎片化（缺乏系统性应用框架）、技术门槛高（提示词设计、数据处理与系统集成能力不足）以及数据安全隐患​（公共模型与本地化部署的权衡困境）。\n本课程以AI技术为核心，围绕“场景赋能-工具实操-体系重构”三大维度展开。课程深度结合《AI财务工作流重构方法论》，系统拆解从自动化账务处理（如发票结构化提取、VBA脚本自动生成）、智能分析（成本波动预测、偿债能力建模）到战略决策支持（投资回报模拟等）的全链路解决方案。通过五维提示词工程、财务数据清洗标准化、AI知识库搭建等实操模块，针对性解决“AI工具调教难”“业务逻辑编码弱”“数据安全不可控”等痛点。课程以真实企业案例为牵引，帮助学员建立“技术-业务-安全”三位一体的AI自动化财务体系，真正实现从基础核算到战略赋能的跨越式升级。\n课程收益：\n● 破解效率瓶颈：掌握AI自动化处理高频财务事务（如发票处理等重复性工作）的核心方法，显著提升财务工作效率\n● 精通AI工具应用：深度掌握AI提示词工程五维操作法，获得财务专属提示词模板及调优技巧，使AI工具生成更加精准、贴合实际需求的内容\n● 重构工作范式：构建智能财务工作流设计能力，实现VBA脚本编写、数据清洗、可视化分析等技术的AI赋能，让财务工作更高效、更有品质\n● 强化决策支持：运用AI完成盈利能力分析、战略解码、投资决策等复杂场景分析，输出专业级分析报告，赋能企事业单位高质量发展\n课程时间：1天，6小时/天\n课程对象：各级财务人员、财务管理者、财务数据配合工作者等\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "name": "《数字化领导力与组织创新》",
    "content": "课程背景：\n当前，数字经济已成为全球经济增长的核心引擎。政策推动、技术革新与市场竞争三重驱动下，企业数字化转型从“可选项”变为“必选项”。\n然而，多数企业面临“战略模糊、资源不足、组织僵化”三大困局——领导者若无法打破传统思维、构建系统性转型框架，将导致转型停滞在表面，错失重塑商业模式的机会。\n本课程聚焦领导者视角，针对“战略认知不足、资源整合低效、组织文化滞后”三大核心痛点，结合标杆企业实践经验，提供从顶层设计到落地执行的完整方法论，帮助领导者突破思维局限，推动数字化转型从“规划图”走向“施工图”。\n课程收益：\n1. 构建战略思维框架：掌握“战略-组织-技术”三位一体的数字化转型顶层设计逻辑；\n2. 突破资源整合瓶颈：用“五级进阶模型”平衡短期收益与长期价值，破解“投入大见效慢”困局；\n3. 掌握关键落地工具：通过“用户价值图+业务演进图+架构生长图”三图联动实现战略精准落地；\n4. 打造组织变革引擎：建立数据驱动的决策机制与文化转型路径，解决“人效低下、部门墙厚重”难题。\n课程时间：2天，6小时/天\n课程对象：\n1. 企业创始人、董事长、CEO等核心决策层\n2. 政府/企业数字化转型领导小组负责人\n3. 战略规划、运营管理、技术研发等中高层管理者\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "content": "课程背景：\n准时化生产是精益生产的一个重要内容，随着时代节奏加快的变化。客户对企业的交货期要求越来越苛刻，能否快速、准确地交货将成为企业未来生存重要考验。同时准时化生产也是企业降低成本，降低库存，增加现金流的制胜法宝。为什么我们很多企业生产周期很长，交货期一拖再拖，在制品堆满车间，产成品库存居高不下，而且有的产成品库龄很高。其实都与生产计划的编制不科学有着很大的关系。因此，学习准时化生产下的生产计划科学编制是企业迫在眉睫的课题，也是当务之急。\n本课程从精益生产的角度出发，深入分析企业的生产形态、产品特点、工艺流程、标准工时、生产节拍、产能负荷关系和客户需求，如何在低的在制品和产成品库存的情况下，做到快速准确地交货。\n课程收益 ：\n● 了解“零库存”是精益生产的核心；\n● 学会分析自己企业的生产形态和产品特点；\n● 学会标准工时的制定方法；\n● 学会产能和负荷的正确评估；\n● 学会如何确定订单的生产节拍；\n● 学会如何计算产品的生产周期；\n● 学会如何进行生产线的平衡技巧；\n● 学会在低在制品和低产成品库存下的快速交货的生产计划编制方法。\n课程时间：2天，6小时/天\n课程对象：生产副总、生产主管、生产计划专员、车间主管、仓库主管、工程技术人员\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "name": "《精益生产实战技法》",
    "content": "课程背景：\n随着全球经济一体化进程的加速，中国的企业不仅要面临国内企业的竞争，还有面对国外企业的竞争。人们对产品和服务的要求越来越高，多品种、低价格、高质量和短交期已成为21世纪市场的主旋律。精益生产方式就是在这种时代的潮流下诞生的，它一出世就显示出旺盛的生命力，实施精益生产的企业一路过关斩将，发展成为世界顶尖级的企业。一时间精益生产方式成为企业制胜的法宝。中国制造业要走出粗放式、高能耗的生产模式，实现绿色的可持续发展，就必须走精益生产之路，就必须向精益制造实践的先行者学习。\n过去一段时间在中国培训业推出的精益生产课程主要是一些抽象的概念，很少有与实际工作相结合的，也没有抓到精益生产的核心。本课程主要从实操层面，通过大量的案例讲述精益生产在实际工作中的运用。\n课程收益：；\n本课程从精益生产“零库存”的核心出发，如何做到原材料、在制品、产成品三个环节的零库存以及精益生产工具在三个环节的具体运用。通过学习，学员将得到以下收益：\n● 了解什么是真正精益生产；\n● 原材料“零库存”在采购、货运、仓储管理的实操技法；\n● 在制品“零库存”在工艺、排产、布局、看板管理、防错、IE管理的实操技法；\n● 产成品“零库存”在订单管理、交期管理的实操技法\n课程时间：2天，6小时/天\n课程对象：高层管理、中基层生产管理人员\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "type": "定制化培训",
    "name": "《生产班组长6门必修课》",
    "content": "课程背景：\n班组是企业最基层的组织，却是企业最重要的一级组织。班组长素质的高低直接关系到企业效益的好坏，因为，企业的任何政策都要靠他们贯彻执行下去。目前企业的班组长普遍存在管理能力弱的情况，很多班组长不敢管、不会管。很多企业开始重视班组长培训，但普遍存在一些误区。一是重视班组长通用管理知识的培训，讲一些领导艺术、沟通技巧，列举的案例都是一些高大上人物事迹，如：牛根生、任正非和马云等；二是重视班组长专业生产管理技能的培训，如：精益生产、成本管理与控制、生产计划和六西格玛等。这些知识好不好，当然好。但是是不是适合班组长的需求呢？\n班组长其实就是一个普通的比较优秀员工，他们面对的是一群普通的员工。他们需要的不是一些高大上的领导艺术或高深专业管理知识，他们需要的是贴近实际工作而容易被普通员工接受的管理方法。班组管理说穿了就是二件事，一是管人二是管事。管人就是怎么让员工相信你佩服你，从而服从你的领导。管事就是如何保证按时完成生产计划、确保产品质量的稳定。\n这6堂课程就是从最基层的实际生产出发，为班组长量身打造的好学好用简单易懂，但又具备与时俱进管理知识。为班组长培训提供新的思路。\n课程收益：\n● 价值1：明确班组长的角色定位-----改变不正确的工作方法\n● 价值2：掌握正确工作教导方法-----员工迅速掌握生产技能\n● 价值3：学会质量控制与攻关法-----让质量提升一个新台阶\n● 价值4：产前产中产后控制技法 ----计划落实交货期获保障\n● 价值5：掌握5S 现场管理技巧----环境设备安全完全改善\n● 价值6：掌握工作关系处理方法----班组团结人心齐泰山移\n课程时间：5天，6小时/天\n课程对象：制造业企业高中基层管理人员\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "name": "《生产管理问题分析与解决》",
    "content": "课程背景：\n发生在2019年末和2020年初的新冠肺炎给中国经济造成上万亿的经济损失和人民生活的困顿。在痛定思痛的前提下，我们应该思考和反思什么呢？这场疫情可不可以阻止它发生？可不可以缩小它的影响范围？其实只要我们各项工作做得好是完全可以做到的。问题在哪？在于我们的干部和群众缺乏问题意识，缺乏对出现问题时的解决方法。\n这种现象在企业生产管理过程中难道不是普遍存在的问题吗？为什么生产现场“脏乱差”长期得不到很好解决，为什么安全事故不断，为什么交货期延误层出不穷，为什么产品质量屡屡出现客户抱怨等等。这些现象的根本原因就是我们的工作人员缺乏问题意识和问题解决办法。\n这个问题不解决将对我们企业的发展带来制约，对全体员工的素质提升带来极大的影响。\n课程收益：\n● 价值1：掌握强化员工的问题意识方法----树立问题意识必须坚持的6项机制\n● 价值2：掌握工作中问题快速识别方法----问题的二阶段性定义问题解决方向\n● 价值3：掌握如何明确问题的透明方法----利用3W1H工具将模糊问题明确化\n● 价值4：掌握如何分解问题的实用技巧----活用4 W 方法分解问题达问题点\n● 价值5：掌握根据问题点设定改善目标----用SMART法则确定出清晰的目标\n● 价值6：掌握问题真正原因的分析方法----连续用5个WHY直捣问题的核心\n● 价值7：掌握审慎制定对策的思考方向----制定对策5大活动筛选正确的对策\n● 价值8：掌握贯彻对策简单易行的方法----用甘特图制定贯彻实施计划防反弹\n● 价值9：掌握评价解决问题效果的方法----三个维度都满意才是真正问题解决\n● 价值10：掌握不使成果昙花一现的方法---PDCA循环使问题解决永远不停步\n课程时间：2天，6小时/天\n课程对象：制造业企业高中基层管理人员\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "type": "定制化培训",
    "name": "《智能化工厂管理与应用》",
    "content": "课程背景：\n我们国家正处在一个大的结构转型升级这么一个时代，现有的技术已不足以支撑经济的快速发展，需要新的技术突破。现在全球面临整个的制造模式也不可持续，必须我们要变革我们现有的模式，寻找一种新的我们的制造模式。\n过去中国改革开放差不多30年的时间，人口红利是我们中国在整个制造业里面一个非常重要的竞争力的一个要素。但是今天劳动力成本已经是在快速上升。还有一个要素，全球所有的行业几乎都是一个产能过剩的现状。现在我们整个市场需求的个性化定制化，技术与产品快速迭代更新，使我们过去我们的生产模式批量，刚性，这种模式已经不可持续了。所以我们的制造模式必须要变革，也就是由过去的大批量刚性过去追求这种规模化，像现在的小批量啊，个性化定制化，也就像我们的柔性智能制造模式来转变。\n进入到第4次工业革命和中国制造2025时代，就是智能制造的这么一个时代。智能制造驱动的要素：第一个要素，我们称之为叫技术要素，包括机器人、互联网、物联网、新的信息技术、大数据、云，实际是为我们这次工业革命的提供了技术的支撑。第二个要素是市场要素，也就是产能过剩，个性化定制化产品，生命周期的快速的更新，在倒逼制造模式的变革。还有一些社会要素，也就是我们劳动力成本的上升，就业人口的减少，资源环境现在无以为继。那么这三大要素支撑，加速了这次制造模式的变革。\n中国制造业能否快速完成这样一个转型升级，关键在于对于智能制造知识的了解和学习。本课程就是针对企业转型过程中开发的，希望对制造业企业有所帮助。\n课程收益：\n● 了解什么智能工厂\n● 了解智能工厂运营和管理方式\n● 了解MES制造系统的运作管理方式\n● 了解智能物流的运作和管理方式\n● 了解SCADA远程监控运作和管理方式\n● 了解RFID射频识别技术运作和管理方式\n课程时间：2天，6小时/天\n课程对象：高层管理、中基层管理人员\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "name": "《TRACC人力资本领导力》",
    "content": "课程背景：\n移动互联网时代，企业发起人才争夺战。\n如何带领团队成功？人力资本TRACC（HC TRACC）关注有抱负的世界级组织需要做哪些工作，以实现人才机制的最优管理和发展。由人才愿景推动，最初关注于“落实基础”，然后在后期阶段着手人力资本优化的核心部分；在人力资本优化的过程中，人才被认为是组织竞争优势的主要来源。TRACC推崇：唯有将直线管理层（执行官、经理和团队领导）、员工和HR团队团结起来，才能实现这个愿景。\n大量研究发现，那些拥有积极态度并能竭尽全力激发并鼓励下属发展的变革型领导总能取得辉煌成就。这些研究还发现，得力领导对自己有更好的了解，更能够意识到自身的优势，注重价值观，且情商较高。 他们通过有效管理与同事和下属之间的交流和关系，开展领导工作。人们习惯用可量化的结果来衡量领导效能，比如，利润增加、产品/服务质量改进、运营成本减少等。\n然而，领导者需要对其自身的优缺点以及如何与他人建立关系进行反思，比如，如何对待下属、如何解决纠纷、如何为团队成员提供发展和成长的机会、如何提供反馈 —— 这些典型标准能够确保绩效目标的实现，展示领导力风范。\n课程收益：\n1. 学规划与精准传达团队愿景，凝聚全员力量，抢占人才竞争高地；\n2. 效管理全流程技巧，利用量化指标驱动团队产出，达成利润提升的成果；\n3. 我认知，掌握反思性领导力，精准洞察自身优缺点，稳固团队关系；\n4. 队价值整合，将个人价值观与组织理念深度融合，激发下属内驱力；\n5. 续改进的方法与思维，能动态优化人才机制与管理模式，保障团队长期保持高效能与强竞争力。\n课程时间：2天，6小时/天\n课程对象：具有高品质工作追求的人力资源从业者、企业高层、中层管理者\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "content": "课程背景：\n人力资源数字化是移动互联网时代的发展趋势，即大数据时代的来临。大数据就是很大的数据。但在不同领域，又有不同状况。大数据作为一种数据集合，当我们使用这个概念的时候，实际包含有三层含义：一是数据很大；二是变化很快；三是构成复杂。但是大数据里面蕴藏着大知识、大智慧、大价值、大发展。因为大数据是一种思维方式和管理、治理路径，尤其是对于人才管理领域来说，数据量变积累达到质变的结果，更是一个可以大幅度提升管理水平的良好契机。\n大数据就是海量信息，“云计算”相当于计算机和操作系统。如果没有大数据的信息积淀，“云计算”的能力再强大，也没有用武之地。二者结合，将给世界带来一场深刻的管理技术革命与社会治理创新。当然，可以强有力支持各行业的人才管理。\n课程特点：\n学术性强：为关键管理者与人力资源岗位工作者而设\n实用性强：案例丰富经典为技术面操作人力资源落地\n系统性强：覆盖人力资源管理与开发全套数字化体系\n操作性强：企业可依据课程进行辅导操作后明显效果\n课程收益：\n1. 开拓管理思路走进数字化时代的领域学习\n2. 提升人力资源管理能力如何切入数字管理\n3. 提高绩效考核指挥棒作用理解数字化绩效\n4. 学习数字化领导力与企业人力培养的关联\n课程时间：2天，6小时/天\n课程对象：人力资源条线、企业管理者\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "content": "课程背景：\n国有企业改制正在进行时，中长期激励是战略问题。\n企业激励，是许多组织面临的现实问题，表面是分钱问题，实质是人的问题，是如何科学分钱给到哪些人的问题。企业创始人共同的期待是激活组织，从理论上讲组织激活的三大杀手锏：挥金如土、求贤若渴、末尾淘汰。但做到的企业，离不开科学的操盘，因为科学分钱是一个系统，而不是老板的一意孤行；科学分钱是一套智慧，而不是基于马斯洛层次理论的刻板执行；科学分钱是多米诺骨牌，牵一发而动全身，而不是单独的麻将牌。\n科学分钱需要“道术结合”，有术无道止于术，有道无术尚可求，有道有术才是本课的重要宗旨。基于企业的真实问题，提供解决思路，提供解决方案。\n课程收益：\n思路：形成一套科学分钱的激励思路，指引具体规章制度的发布；\n表格：拿到一套具体实操的企业表格，落地执行过程中的标准化；\n方法：总结提炼企业存在的共性问题，运用通用模板破解关键点；\n专业：掌握激励员工的专业薪酬设计，应对企业中个性化的问题。\n课程时间：2天，6小时/天\n课程对象：企业决策者、高层管理、中层管理、HRD\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

    "content": "课程背景：\n降低人工成本与提升人效，是一枚硬币的双面。\n大环境的变化与行业竞争，让企业回归更理性的管理，关于降本增效的解决方案，需要使用科学的分析与控制。企业管理者越来越清楚成本控制不是单纯减少，是要考核性价比，如果成本增加后，减少的其他的运营成本或者增加的利润与成本付出相比较大，那何乐而不为呢？再比如：员工收入的增长必然会引起成本的上升吗？从美国、日本、德国等国的经验来看，中国企业还存在着很大的管理提升的空间。通过管理的实施有可能实现人均生产效率提升30%，质量不良率下降50%，库存减少50%。企业转型升级是个热门话题，但对于大多数中国企业而言，最迫切的是管理升级。随着成本上升，企业利润空间不断被压缩，如何在微利时代生存下来成为企业的首要任务，课程交付18套ROI (return on investment)方案。\n什么是ROI？是指通过投资而应返回的价值，即企业从一项投资活动中得到的经济回报。它涵盖了企业的获利目标，这里专指通过成本的科学管控，企业得到的价值。\n课程收益：\n价值1：从系统经营思维进行科学降本增效\n价值2：从战略成本角度进行科学降本增效\n价值3：从价值链角度分析战略成本的管理\n价值4：人力成本是重要的关注对象可干预\n课程时间：2天，6小时/天\n课程对象：管理层、决策层\\n课时：根据企业需求\\n指导报价区间：1.5-2万/天",

            renderBusinessItems();

            reviewerPage = 1;

            document.getElementById('reviewerUnitSearch').value = '';
            renderReviewerOptions();
            document.getElementById('reviewerModal').classList.add('active');
            document.body.classList.add('overflow-hidden');
        }

        function closeReviewerModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('reviewerModal').classList.remove('active');
            document.body.classList.remove('overflow-hidden');
        }

        function renderReviewerUnitSuggestions() {
            const query = document.getElementById('reviewerUnitSearch').value.trim().toLowerCase();
            const suggestions = orgs.filter(unit => !query || unit.toLowerCase().includes(query)).slice(0, 8);
            const container = document.getElementById('reviewerUnitSuggestions');
            container.innerHTML = suggestions.map(unit => `<button type="button" class="reviewer-unit-suggestion" data-unit="${escapeHtml(unit)}">${escapeHtml(unit)}</button>`).join('');
            container.classList.toggle('hidden', !suggestions.length);
            container.querySelectorAll('[data-unit]').forEach(button => {
                button.addEventListener('mousedown', event => event.preventDefault());
                button.addEventListener('click', () => selectReviewerUnit(button.dataset.unit));
            });
        }

        function selectReviewerUnit(unit) {
            document.getElementById('reviewerUnitSearch').value = unit;
            reviewerFilters.unit = unit.toLowerCase();
            reviewerPage = 1;
            renderReviewerOptions();
            document.getElementById('reviewerUnitSuggestions').classList.add('hidden');
        }

        function renderReviewerOptions() {
            const selectedIds = new Set(selectedReviewers.map(person => person.id));
            const filteredReviewers = reviewerCandidates.filter(person => {
                return (!reviewerFilters.name || person.name.toLowerCase().includes(reviewerFilters.name))
                    && (!reviewerFilters.id || person.id.toLowerCase().includes(reviewerFilters.id))
                    && (!reviewerFilters.unit || person.unit.toLowerCase().includes(reviewerFilters.unit));
            });
            const totalPages = Math.max(1, Math.ceil(filteredReviewers.length / reviewerPageSize));
            reviewerPage = Math.min(reviewerPage, totalPages);
            const start = (reviewerPage - 1) * reviewerPageSize;
            const pageReviewers = filteredReviewers.slice(start, start + reviewerPageSize);
            document.getElementById('reviewerOptions').innerHTML = pageReviewers.length ? pageReviewers.map(person => `
                <tr>
                    <td class="text-center"><input type="checkbox" value="${escapeHtml(person.id)}" ${selectedIds.has(person.id) ? 'checked' : ''}></td>
                    <td class="text-slate-700">${escapeHtml(person.name)}</td>
                    <td class="text-slate-600">${escapeHtml(person.id)}</td>
                    <td class="text-slate-600">${escapeHtml(person.unit)}</td>
                    <td class="text-slate-600">${escapeHtml(person.phone)}</td>
                </tr>
            `).join('') : '<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">未找到匹配的审核人员</td></tr>';
            document.getElementById('reviewerPageInfo').textContent = `共 ${filteredReviewers.length} 人，第 ${reviewerPage} / ${totalPages} 页`;
            document.getElementById('reviewerPrev').disabled = reviewerPage <= 1;
            document.getElementById('reviewerNext').disabled = reviewerPage >= totalPages;
        }

        function changeReviewerPage(step) {
            reviewerPage += step;
            renderReviewerOptions();
        }

        function confirmReviewers() {
            const selectedIds = [...document.querySelectorAll('#reviewerOptions input[type="checkbox"]:checked')].map(input => input.value);
            selectedReviewers.splice(0, selectedReviewers.length, ...reviewerCandidates.filter(person => selectedIds.includes(person.id)));
            renderReviewers();
            closeReviewerModal();
        }

        function removeReviewer(id) {
            const index = selectedReviewers.findIndex(person => person.id === id);
            if (index >= 0) selectedReviewers.splice(index, 1);
            renderReviewers();
        }

        function renderReviewers() {
            const container = document.getElementById('reviewerList');
            if (!selectedReviewers.length) {
                container.innerHTML = '<div class="reviewer-empty">暂无审核人员，请点击右上角选择人员</div>';
                return;
            }
            container.innerHTML = `
                <div class="border border-slate-200 rounded-lg overflow-hidden">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 text-slate-700">
                            <tr>
                                <th class="px-4 py-3 text-left font-semibold">人员姓名</th>

                                    <td class="px-4 py-3 text-slate-600">${escapeHtml(person.id)}</td>
                                    <td class="px-4 py-3 text-slate-600">${escapeHtml(person.unit)}</td>
                                    <td class="px-4 py-3 text-slate-600">${escapeHtml(person.phone)}</td>
                                    <td class="px-4 py-3 text-center"><button type="button" onclick="removeReviewer('${escapeHtml(person.id)}')" class="text-red-600 hover:text-red-700">删除</button></td>

                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function addBusinessItem() {
            pendingBusiness.category = '技术服务';
            pendingBusiness.type = '';
            pendingBusiness.name = '';
            renderModalBusinessOptions();
            document.getElementById('businessModal').classList.add('active');
            document.body.classList.add('overflow-hidden');
        }

            if (event && event.target !== event.currentTarget) return;
            document.getElementById('businessModal').classList.remove('active');
            document.body.classList.remove('overflow-hidden');

            pendingBusiness.category = category;
            pendingBusiness.type = '';
            pendingBusiness.name = '';

                const active = button.dataset.modalCategory === category;
                button.classList.toggle('bg-blue-600', active);

            if (!pendingBusiness.category || !pendingBusiness.type || !pendingBusiness.name) {
                showToast('请选择完整的业务信息');

                </div>
            `).join('');

            businessRows.forEach((_, index) => applySelectedBusiness(index));
        }

        function syncBusinessRowsFromDom() {
            businessRows.forEach((row, index) => {
                const content = document.getElementById(`serviceContent-${index}`);
                if (content) row.content = content.value;
            });
        }

        function getBusinessName(row) {
            const item = serviceItems.find(candidate => candidate.category === row.category && candidate.type === row.type && String(candidate.no) === String(row.name));
            return item?.name || '--';
        }

        function applySelectedBusiness(index) {
            const row = businessRows[index];
            const no = Number(row.name);
            const item = serviceItems.find(candidate => candidate.category === row.category && candidate.no === no);
            document.getElementById(`serviceContent-${index}`).value = row.content ?? item?.content ?? '';
            document.getElementById(`serviceField-${index}`).textContent = item?.field || '--';
            document.getElementById(`proposalPlan-${index}`).textContent = item?.proposal ? String(item.proposal).replace(/\\n/g, '\n') : '--';
            const isTechService = row.category === '技术服务';
            document.getElementById(`proposalField-${index}`).classList.toggle('hidden', !isTechService);
        }

        document.getElementById('businessItems').addEventListener('input', event => {
            const index = Number(event.target.dataset.index);
            if (event.target.dataset.field === 'content' && businessRows[index]) {
                businessRows[index].content = event.target.value;
            }
        });

        document.getElementById('customerName').addEventListener('input', updateCustomerCreditCode);
        document.getElementById('customerName').addEventListener('change', updateCustomerCreditCode);

        function renderFiles() {
            const body = document.getElementById('attachmentBody');
            if (!files.length) {
                body.innerHTML = '<tr id="emptyAttachment"><td colspan="4" class="px-4 py-8 text-center text-slate-500">暂无随附单据，请点击选择文件或拖拽文件到上方区域</td></tr>';
                return;
            }
            body.innerHTML = files.map((entry, index) => `
                <tr>
                    <td class="px-4 py-3 text-slate-700">${escapeHtml(entry.file.name)}</td>
                    <td class="px-4 py-3 text-center text-slate-600">李俊峰</td>
                    <td class="px-4 py-3 text-center text-slate-600">${entry.date}</td>
                    <td class="px-4 py-3 text-center">
                        <button type="button" onclick="previewFile(${index})" class="text-blue-600 hover:text-blue-700 text-sm mr-3">预览</button>
                        <button type="button" onclick="downloadFile(${index})" class="text-blue-600 hover:text-blue-700 text-sm mr-3">下载</button>
                        <button type="button" onclick="removeFile(${index})" class="text-red-600 hover:text-red-700 text-sm">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function addFiles(fileList) {
            Array.from(fileList || []).forEach(file => {
                files.push({
                    file,
                    url: URL.createObjectURL(file),
                    date: new Date().toISOString().slice(0, 10)
                });
            });
            renderFiles();
            if (files.length) showToast('附件上传成功');
        }

        function previewFile(index) {
            const entry = files[index];
            if (!entry) return;
            window.open(entry.url, '_blank');
        }

        function downloadFile(index) {
            const entry = files[index];
            if (!entry) return;
            const link = document.createElement('a');
            link.href = entry.url;
            link.download = entry.file.name;
            link.click();
        }

        function removeFile(index) {
            const [entry] = files.splice(index, 1);
            if (entry?.url) URL.revokeObjectURL(entry.url);
            renderFiles();
            showToast('附件已删除');
        }

        document.getElementById('projectFiles').addEventListener('change', event => {
            addFiles(event.target.files);
            event.target.value = '';
        });

        ['dragenter', 'dragover'].forEach(type => {
            document.getElementById('uploadZone').addEventListener(type, event => {
                event.preventDefault();
                document.getElementById('uploadZone').classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(type => {
            document.getElementById('uploadZone').addEventListener(type, event => {
                event.preventDefault();
                document.getElementById('uploadZone').classList.remove('dragover');
            });
        });

        document.getElementById('uploadZone').addEventListener('drop', event => addFiles(event.dataTransfer.files));

        function validateForm() {
            syncBusinessRowsFromDom();
            const requiredIds = ['customerName', 'siteOrg', 'sourceOrg', 'startDate', 'endDate'];
            if (requiredIds.some(id => !document.getElementById(id).value)) {
                showToast('请先填写必填信息');
                return false;
            }
            if (!businessRows.length || businessRows.some(row => !row.category || !row.type || !row.name || !row.content?.trim())) {
                showToast('请完善每条业务信息');
                return false;
            }
            if (document.getElementById('endDate').value < document.getElementById('startDate').value) {
                showToast('计划结束日期不能早于启动日期');
                return false;
            }
            return true;
        }

        function saveDraft() {
            showToast('已保存草稿');
        }

        function submitForm() {
            if (!validateForm()) return;
            showToast('审核项目已提交');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden', 'opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 1800);
        }

        function initAnchorNavigation() {
            const links = [...document.querySelectorAll('.anchor-link')];
            const sections = links.map(link => document.querySelector(link.getAttribute('href'))).filter(Boolean);
            const setActive = id => links.forEach(link => link.classList.toggle('active', link.getAttribute('href') === `#${id}`));
            const updateActive = () => {
                const threshold = 132;
                let current = sections[0];
                sections.forEach(section => {
                    if (section.getBoundingClientRect().top <= threshold) current = section;
                });
                if (current) setActive(current.id);
            };
            links.forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    const target = document.querySelector(link.getAttribute('href'));
                    if (!target) return;
                    setActive(target.id);
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
            window.addEventListener('scroll', updateActive, { passive: true });
            updateActive();
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        fillDatalist('customerOptions', customers);
        fillDatalist('orgOptions', orgs);
        fillDatalist('reviewerUnitOptions', orgs);
        initAnchorNavigation();
        initBusinessOptions();
    </script>
</body>
</html>
