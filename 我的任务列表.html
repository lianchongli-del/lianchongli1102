<div class="mask" id="task-modal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="dialog-header"><h2 id="modal-title"></h2><button type="button" class="close" id="modal-close" aria-label="关闭弹窗">×</button></header><div class="dialog-body" id="modal-body"></div><footer class="dialog-footer" id="modal-footer"></footer></section></div><div class="scope-tooltip" id="scope-tooltip" role="tooltip" hidden></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flow={"审核任务确认":["任务待确认","任务已确认"],"审核计划编制":["审核计划待提交","审核计划待签字","审核计划待确认","审核计划已撤回"],"现场审核实施":["审核待开始","审核进行中"],"审核后活动":["审核后活动"],"任务已完成":["任务已完成"],"审核计划已驳回":["审核计划已驳回"]};
const permissions={"任务待确认":["任务详情","任务确认"],"任务已确认":["任务详情"],"审核计划待提交":["任务详情","审核计划编制"],"审核计划待签字":["任务详情","审核计划签字"],"审核计划待确认":["任务详情"],"审核待开始":["任务详情"],"审核进行中":["任务详情","任务实施"],"审核后活动":["任务详情"],"任务已完成":["任务详情"],"审核计划已驳回":["任务详情","审核计划编制"],"审核计划已撤回":["任务详情","审核计划编制"]};
const clients=['北京华科智能制造有限公司','上海新源材料科技有限公司','广州恒信食品有限公司','深圳远航信息技术有限公司','苏州精工机电有限公司','杭州启明科技有限公司','成都绿源环境工程有限公司','天津滨海装备有限公司'];
const leaders=['张明','刘洋','李华','王璐','陈晨','赵敏'];
const domainSets=[['QMS','EMS'],['QMS','EMS','OHS','HSE'],['FSMS','QMS'],['ITSN','BCMS'],['QMS'],['QMS','EMS','OHS'],['EMS','HSE'],['QMS','OHS']];
const scopeMap={QMS:'智能设备及机械零部件的设计、生产与销售',EMS:'生产经营活动及相关环境管理活动',OHS:'生产经营场所及相关职业健康安全管理活动',ITSN:'信息技术服务及运维管理',BCMS:'信息技术服务的业务连续性管理',HSE:'生产经营活动的健康、安全与环境管理',FSMS:'食品的生产、加工与销售'};
const allStatuses=Object.values(flow).flat();
const seed=Array.from({length:24},(_,i)=>{const n=i%8,date='2026-10-'+String(5+i).padStart(2,'0');return {id:'RW/20261001/'+String(i+1).padStart(4,'0')+(i===13||i===20?'(子)':''),company:clients[n],domains:domainSets[n],stage:['二阶段','一阶段','一阶段（无现场）'][i%3],multi:i%3===0?'是':'否',parent:i===13?'RW/20261001/0002':i===20?'RW/20261001/0009':'-',start:date,end:'2026-10-'+String(6+i).padStart(2,'0'),leader:leaders[i%6],status:allStatuses[i%allStatuses.length],report:['上报中','已上报','上报失败'][i%3],scopes:Object.fromEntries(domainSets[n].map(d=>[d,scopeMap[d]]))}});
const additionalAfterAuditSamples=['一阶段','二阶段','一阶段（无现场）','二阶段','一阶段','二阶段'].map((stage,i)=>{const n=i%clients.length,domains=[...domainSets[n]];return{id:'RW/20261015/'+String(101+i).padStart(4,'0'),company:clients[n],domains,stage,multi:i%2===0?'是':'否',parent:'-',start:'2026-10-'+(19+i),end:'2026-10-'+(20+i),leader:leaders[i%leaders.length],status:'审核后活动',report:'-',scopes:Object.fromEntries(domains.map(domain=>[domain,scopeMap[domain]]))}});
seed.push(...additionalAfterAuditSamples);
let tasks=structuredClone(seed),activeGroup='',activeStatus='',draftStage='',applied={},page=1,pageSize=10,modalOpener=null,toastTimer;
try{const saved=JSON.parse(localStorage.getItem('audit-task-list-2-v1'));if(Array.isArray(saved))saved.forEach(t=>{if(t.status==='审核计划确认')t.status='审核计划待确认';if(t.status==='审核已完成')t.status='审核后活动'});if(Array.isArray(saved))saved.forEach(t=>{if(t.status==='审核计划确认')t.status='审核计划待确认';if(t.status==='审核已完成')t.status='审核后活动'});if(Array.isArray(saved)&&saved.every(t=>t.id&&t.company&&permissions[t.status]&&Array.isArray(t.domains)&&t.scopes))tasks=saved}catch{}
try{if(!localStorage.getItem('audit-task-list-2-after-samples-v2')){for(const sample of additionalAfterAuditSamples){if(!tasks.some(t=>t.id===sample.id))tasks.push(structuredClone(sample))}localStorage.setItem('audit-task-list-2-v1',JSON.stringify(tasks));localStorage.setItem('audit-task-list-2-after-samples-v2','1')}}catch{}
try{if(!localStorage.getItem('audit-task-list-2-withdrawn-plan-v1')){if(!tasks.some(t=>t.status==='审核计划已撤回')){const examples=seed.filter(t=>t.status==='审核计划已撤回').slice(0,2).map((t,i)=>({...structuredClone(t),id:'RW/20261015/'+String(201+i).padStart(4,'0'),parent:'-',planContent:'审核计划已撤回，待重新编制'}));tasks.push(...examples)}localStorage.setItem('audit-task-list-2-v1',JSON.stringify(tasks));localStorage.setItem('audit-task-list-2-withdrawn-plan-v1','1')}}catch{}
const reportingEnabled=false;
function hasReceived(t){return !['任务待提交','任务已提交','任务已撤回'].includes(t.status)&&(t.received===true||['任务已接收','审核计划待确认','审核计划已驳回','审核待开始','审核进行中','审核后活动','任务已完成'].includes(t.status))}
function reportValue(t){return reportingEnabled&&hasReceived(t)?(['上报中','已上报','上报失败'].includes(t.report)?t.report:'上报中'):'-'}
function reportCell(t){return reportingEnabled?'<td>'+(reportValue(t)==='-'?'<span class="muted">-</span>':badge(reportValue(t)))+'</td>':''}
function actionsFor(t){return [...permissions[t.status],...(t.status==='审核后活动'?[t.stage==='二阶段'?'不符合项纠正':'问题整改']:[])]}
tasks.forEach(t=>{if(t.status==='审核计划确认')t.status='审核计划待确认';if(t.status==='审核已完成')t.status='审核后活动';t.received=hasReceived(t);t.report=reportValue(t)});
function persist(){try{localStorage.setItem('audit-task-list-2-v1',JSON.stringify(tasks))}catch{}}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').style.display='block';toastTimer=setTimeout(()=>$('toast').style.display='none',3000)}
function groupOf(t){return Object.keys(flow).find(k=>flow[k].includes(t.status))}
function baseRows(){return tasks.filter(t=>(!applied.id||t.id.toLowerCase().includes(applied.id.toLowerCase()))&&(!applied.company||t.company.includes(applied.company))&&(!applied.leader||t.leader.includes(applied.leader))&&(!applied.stage||t.stage===applied.stage)&&(!applied.start||t.end>=applied.start)&&(!applied.end||t.start<=applied.end))}
function visibleRows(){const reportOrder=['-','上报中','已上报','上报失败'];return baseRows().filter(t=>(!activeGroup||groupOf(t)===activeGroup)&&(!activeStatus||t.status===activeStatus)).sort((a,b)=>allStatuses.indexOf(a.status)-allStatuses.indexOf(b.status)||reportOrder.indexOf(reportValue(a))-reportOrder.indexOf(reportValue(b))||a.start.localeCompare(b.start)||a.id.localeCompare(b.id))}
const statusColors={"任务待提交":"#d97706","任务已提交":"#2563eb","任务已接收":"#059669","任务已撤回":"#64748b","任务待确认":"#0891b2","任务已确认":"#65a30d","审核计划待提交":"#ea580c","审核计划待签字":"#7c3aed","审核计划待确认":"#db2777","审核计划已驳回":"#dc2626","审核待开始":"#0d9488","审核进行中":"#4f46e5","审核后活动":"#a16207","任务已完成":"#15803d","任务已退回":"#be123c","上报中":"#0284c7","已上报":"#16a34a","上报失败":"#b91c1c","审核计划已撤回":"#93704a"};
function color(s){return statusColors[s]||'#64748b'}
function badge(s){return '<span class="status" style="--status-color:'+color(s)+'">'+esc(s)+'</span>'}
function renderStages(){$('stage-filter').innerHTML='<label for="f-stage">审核阶段</label><select id="f-stage" aria-label="审核阶段">'+['','一阶段','一阶段（无现场）','二阶段'].map(s=>'<option value="'+esc(s)+'" '+(s===draftStage?'selected':'')+'>'+(s||'全部阶段')+'</option>').join('')}
function renderFlow(base){
 const groups=Object.keys(flow),exceptions=groups.filter(g=>/退回|驳回/.test(g)),steps=groups.filter(g=>!exceptions.includes(g));
 const count=g=>g==='任务已完成'?'':'<span class="flow-count">（'+base.filter(t=>!g||groupOf(t)===g).length+'）</span>';
 const button=(g,kind,order)=>'<button type="button" class="status-tab '+kind+' '+(activeGroup===g?'active':'')+'" data-group="'+esc(g)+'" aria-pressed="'+(activeGroup===g)+'">'+(kind==='exception-flow'?'<span class="exception-icon" aria-hidden="true">↶</span>':'')+'<span class="flow-label">'+(g||'全部')+'</span>'+count(g)+'</button>';
 $('primary-tabs').innerHTML=button('','all-flow')+'<div class="flow-track">'+steps.map(g=>button(g,'flow-step')).join('<span class="flow-connector" aria-hidden="true">›</span>')+'</div>'+(exceptions.length?'<div class="exception-track">'+exceptions.map(g=>button(g,'exception-flow')).join('')+'</div>':'');
}
function render(){hideScopePreview();const base=baseRows();renderFlow(base);const subs=activeGroup?flow[activeGroup]:[];$('secondary-tabs').hidden=subs.length<=1;$('secondary-tabs').innerHTML=subs.length>1?'<span>任务状态</span>'+['',...subs].map(s=>'<button type="button" class="chip '+(s===activeStatus?'active':'')+'" data-status="'+esc(s)+'" aria-pressed="'+(s===activeStatus)+'">'+(s||'全部')+(s&&s!=='任务已完成'?' <span class="muted">'+base.filter(t=>t.status===s).length+'</span>':'')+'</button>').join(''):'';const rows=visibleRows(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);$('total').textContent=rows.length;$('task-count').textContent=rows.length;
 $('task-body').innerHTML=rows.slice((page-1)*pageSize,page*pageSize).map(t=>'<tr><td><button class="action task-link" data-id="'+esc(t.id)+'" data-action="任务详情">'+esc(t.id)+'</button></td><td><span class="company" title="'+esc(t.company)+'">'+esc(t.company)+'</span></td><td><div class="domain-tags">'+t.domains.slice(0,2).map(d=>'<span class="field-tag">'+esc(d)+'</span>').join('')+(t.domains.length>2?'<button class="field-tag more-tag" data-id="'+esc(t.id)+'" data-action="认证领域" title="'+esc(t.domains.join(' / '))+'" aria-label="查看全部认证领域">+'+(t.domains.length-2)+'</button>':'')+'</div></td><td><div class="scope-lines"><span tabindex="0" data-scope-id="'+esc(t.id)+'" aria-label="查看完整审核范围">'+esc(t.domains.map(d=>d+'：'+t.scopes[d]).join('；'))+'</span></div></td><td><span class="stage-tag '+(t.stage.includes('无现场')?'no-site':'')+'">'+esc(t.stage)+'</span></td><td>'+t.multi+'</td><td>'+(t.parent==='-'?'<span class="muted">-</span>':'<button class="action parent-link" data-id="'+esc(t.parent)+'" data-action="任务详情">'+esc(t.parent)+'</button>')+'</td><td>'+esc(t.start)+'</td><td>'+esc(t.end)+'</td><td>'+esc(t.leader)+'</td>'+reportCell(t)+'<td>'+badge(t.status)+'</td><td class="col-action"><div class="actions">'+actionsFor(t).map(a=>'<button class="action '+(a==='删除'?'danger':'')+'" data-id="'+esc(t.id)+'" data-action="'+a+'">'+a+'</button>').join('')+'</div></td></tr>').join('')||'<tr><td colspan="12" class="empty empty-state"><strong>暂无符合条件的审核任务</strong>请调整筛选条件后重新查询</td></tr>';
 $('page-buttons').innerHTML=Array.from({length:pages},(_,i)=>'<button class="page-number '+(page===i+1?'active':'')+'" data-page="'+(i+1)+'" aria-label="第 '+(i+1)+' 页" '+(page===i+1?'aria-current="page"':'')+'>'+(i+1)+'</button>').join('');$('prev-page').disabled=page<=1;$('next-page').disabled=page>=pages;$('page-jump').value=page;$('page-jump').max=pages;requestAnimationFrame(syncTaskColumns);
}
function openModal(title,body,actionLabel,onAction){modalOpener=document.activeElement;$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-footer').innerHTML='<button class="btn secondary" id="modal-cancel">'+(actionLabel?'取消':'关闭')+'</button>'+(actionLabel?'<button class="btn primary" id="modal-submit">'+esc(actionLabel)+'</button>':'');$('task-modal').classList.add('show');document.body.style.overflow='hidden';$('modal-cancel').onclick=closeModal;if(actionLabel)$('modal-submit').onclick=onAction;$('modal-close').focus()}
function closeModal(){$('task-modal').classList.remove('show');document.body.style.overflow='';modalOpener?.focus()}
function detail(t){return '<div class="summary"><div class="summary-title">'+esc(t.company)+'</div><span>'+esc(t.id)+'</span></div><div class="detail-grid">'+[['任务状态',t.status],...(reportingEnabled?[['上报状态',reportValue(t)]]:[]),['审核阶段',t.stage],['审核组长',t.leader],['是否多场所',t.multi],['所属父级任务单号',t.parent],['计划审核开始日期',t.start],['计划审核结束日期',t.end]].map(([k,v])=>'<div><label>'+k+'</label><p>'+esc(v)+'</p></div>').join('')+'<div class="wide"><label>认证领域及审核范围</label>'+t.domains.map(d=>'<p><span class="field-tag">'+esc(d)+'</span> '+esc(t.scopes[d])+'</p>').join('')+'</div></div>'}
function editor(t,supplement){return '<p class="modal-notice">'+(supplement?'补充审核将创建子任务，并关联当前父任务。':'修改当前审核任务信息。')+'</p><form id="edit-form" class="detail-grid"><div class="wide"><label>任务单号</label><p>'+esc(supplement?'保存后生成子任务单号':t.id)+'</p></div><div><label for="e-company">客户名称</label><input id="e-company" required value="'+esc(t.company)+'"></div><div><label for="e-leader">审核组长</label><input id="e-leader" required value="'+esc(t.leader)+'"></div><div><label for="e-start">计划审核开始日期</label><input type="date" id="e-start" required value="'+esc(t.start)+'"></div><div><label for="e-end">计划审核结束日期</label><input type="date" id="e-end" required value="'+esc(t.end)+'"></div><div><label for="e-stage">审核阶段</label><select id="e-stage">'+['一阶段','一阶段（无现场）','二阶段'].map(s=>'<option '+(s===t.stage?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div><label for="e-multi">是否多场所</label><select id="e-multi">'+['否','是'].map(s=>'<option '+(s===t.multi?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="wide"><label>认证领域</label>'+Object.keys(scopeMap).map(d=>'<label style="display:inline-flex;align-items:center;gap:5px;margin-right:16px"><input style="width:auto;height:auto" type="checkbox" name="domain" value="'+d+'" '+(t.domains.includes(d)?'checked':'')+'>'+d+'</label>').join('')+'</div>'+Object.keys(scopeMap).map(d=>'<div class="wide" data-scope="'+d+'" '+(t.domains.includes(d)?'':'hidden')+'><label for="scope-'+d+'">'+d+' 审核范围</label><textarea id="scope-'+d+'">'+esc(t.scopes[d]||scopeMap[d])+'</textarea></div>').join('')+'</form>'}
function saveEdit(t,supplement){if(!$('edit-form').reportValidity())return;const domains=[...document.querySelectorAll('[name="domain"]:checked')].map(x=>x.value);if(!domains.length){notify('请选择至少一个认证领域');return}if($('e-start').value>$('e-end').value){notify('计划审核结束日期不能早于开始日期');return}if(domains.some(d=>!$('scope-'+d).value.trim())){notify('请填写所选认证领域的审核范围');return}const updated={...t,company:$('e-company').value.trim(),leader:$('e-leader').value.trim(),start:$('e-start').value,end:$('e-end').value,stage:$('e-stage').value,multi:$('e-multi').value,domains,scopes:Object.fromEntries(domains.map(d=>[d,$('scope-'+d).value.trim()]))};if(!updated.company||!updated.leader){notify('客户名称和审核组长不能为空');return}if(supplement){let n=tasks.length+1,id;do{id='RW/20261013/'+String(n++).padStart(4,'0')+'(子)'}while(tasks.some(x=>x.id===id));updated.id=id;updated.parent=t.parent==='-'?t.id:t.parent;updated.status='任务待确认';updated.received=false;updated.report='-';tasks.unshift(updated);activeGroup='审核任务确认';activeStatus='任务待确认';applied={};$('filter-form').reset();draftStage='';$('f-date-start').value='';$('f-date-end').value='';updateDateRangeLabel();renderStages();page=1}else{Object.assign(t,updated)}persist();closeModal();render();notify(supplement?'补充审核子任务已创建':'任务信息已保存')}
function handleAction(id,a){const t=tasks.find(t=>t.id===id);if(!t){notify('未找到关联任务');return}if(a==='任务详情'||a==='认证领域'){openModal(a,detail(t));return}if(!actionsFor(t).includes(a)&&!(reportingEnabled&&reportValue(t)==='上报失败'&&['重新上报','手动处理'].includes(a)))return;

 if(a==='任务确认'){openModal('任务确认',detail(t)+'<p class="modal-notice" style="margin-top:18px">确认接收当前审核任务。</p>','确认任务',()=>{t.status='任务已确认';persist();closeModal();render();notify('任务已确认')});return}
 if(a==='审核计划编制'){openModal('审核计划编制',detail(t)+'<p class="modal-notice" style="margin-top:18px">填写审核计划，保存草稿或提交签字。</p><div class="detail-grid"><div class="wide"><label for="plan-content">审核计划内容</label><textarea id="plan-content" placeholder="请输入审核活动、人员安排及时间计划">'+esc(t.planContent||'')+'</textarea></div><div class="wide"><label for="plan-action">保存方式</label><select id="plan-action"><option>保存草稿</option><option>提交签字</option></select></div></div>','保存',()=>{if(!$('plan-content').value.trim()){notify('请填写审核计划内容');return}t.planContent=$('plan-content').value.trim();t.status=$('plan-action').value==='提交签字'?'审核计划待签字':'审核计划待提交';persist();closeModal();render();notify('审核计划已保存')});return}
 if(a==='审核计划签字'){openModal('审核计划签字',detail(t)+'<div class="summary" style="margin-top:18px"><label>审核计划内容</label><p>'+esc(t.planContent||'按任务安排进行现场审核，核验审核范围内的相关活动和记录。')+'</p></div><div class="detail-grid"><div class="wide"><label for="sign-name">签字人姓名</label><input id="sign-name" placeholder="请输入签字人姓名" value="'+esc(t.leader)+'"></div><div class="wide"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sign-check" style="width:auto;height:auto">我已阅读并确认审核计划</label></div></div>','确认签字',()=>{if(!$('sign-name').value.trim()||!$('sign-check').checked){notify('请填写签字人并勾选确认');return}t.signName=$('sign-name').value.trim();t.status='审核计划待确认';persist();closeModal();render();notify('已模拟完成签字，计划待确认')});return}
 if(a==='问题整改'||a==='不符合项纠正'){const key=a==='问题整改'?'rectification':'correction';openModal(a,detail(t)+'<div class="detail-grid" style="margin-top:18px"><div class="wide"><label for="correction-note">'+a+'记录</label><textarea id="correction-note" placeholder="请输入处理措施、结果及证据说明">'+esc(t[key]||'')+'</textarea></div></div>','保存记录',()=>{if(!$('correction-note').value.trim()){notify('请填写'+a+'记录');return}t[key]=$('correction-note').value.trim();persist();closeModal();render();notify(a+'记录已保存')});return}
 if(a==='编辑'||a==='新增补充审核'){const supplement=a==='新增补充审核';openModal(a,editor(t,supplement),'保存',()=>saveEdit(t,supplement));return}

 if(a==='任务实施'){openModal('任务实施',detail(t)+'<p class="modal-notice" style="margin-top:18px">记录本次审核的实施情况。</p><div class="detail-grid"><div class="wide"><label for="implementation-note">实施记录</label><textarea id="implementation-note" placeholder="请输入审核实施记录">'+esc(t.implementation||'')+'</textarea></div><div class="wide"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="implementation-done" style="width:auto;height:auto">完成审核并进入审核后活动</label></div></div>','保存实施记录',()=>{if(!$('implementation-note').value.trim()){notify('请填写实施记录');return}t.implementation=$('implementation-note').value.trim();if($('implementation-done').checked)t.status='审核后活动';persist();closeModal();render();notify('实施记录已保存')})}
}
let scopePreviewTimer=null,scopePreviewAnchor=null;
function hideScopePreview(){clearTimeout(scopePreviewTimer);$('scope-tooltip').hidden=true;scopePreviewAnchor?.removeAttribute('aria-describedby');scopePreviewAnchor=null}
function scheduleScopeHide(){clearTimeout(scopePreviewTimer);scopePreviewTimer=setTimeout(hideScopePreview,120)}
function showScopePreview(anchor){clearTimeout(scopePreviewTimer);const t=tasks.find(t=>t.id===anchor.dataset.scopeId);if(!t)return;scopePreviewAnchor?.removeAttribute('aria-describedby');scopePreviewAnchor=anchor;const tip=$('scope-tooltip');tip.innerHTML='<strong>审核范围</strong>'+t.domains.map(d=>'<div class="scope-preview-item"><span>'+esc(d)+'</span><p>'+esc(t.scopes[d])+'</p></div>').join('');tip.hidden=false;anchor.setAttribute('aria-describedby','scope-tooltip');const box=anchor.getBoundingClientRect();tip.style.left=Math.max(12,Math.min(box.left,innerWidth-tip.offsetWidth-12))+'px';tip.style.top=Math.max(12,Math.min(box.bottom+8+tip.offsetHeight<=innerHeight?box.bottom+8:box.top-tip.offsetHeight-8,innerHeight-tip.offsetHeight-12))+'px'}
$('task-body').addEventListener('pointerover',e=>{const anchor=e.target.closest('[data-scope-id]');if(anchor)showScopePreview(anchor)});
$('task-body').addEventListener('pointerout',e=>{if(e.target.closest('[data-scope-id]'))scheduleScopeHide()});
$('task-body').addEventListener('focusin',e=>{const anchor=e.target.closest('[data-scope-id]');if(anchor)showScopePreview(anchor)});
$('task-body').addEventListener('focusout',e=>{if(e.target.closest('[data-scope-id]'))scheduleScopeHide()});
$('scope-tooltip').addEventListener('pointerenter',()=>clearTimeout(scopePreviewTimer));$('scope-tooltip').addEventListener('pointerleave',scheduleScopeHide);
window.addEventListener('resize',hideScopePreview);window.addEventListener('scroll',e=>{if(e.target!==$('scope-tooltip'))hideScopePreview()},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideScopePreview()});
$('task-body').onclick=e=>{const b=e.target.closest('[data-action]');if(b)handleAction(b.dataset.id,b.dataset.action)};
$('modal-body').onchange=e=>{if(e.target.name==='domain'){const row=document.querySelector('[data-scope="'+e.target.value+'"]');if(row)row.hidden=!e.target.checked}};
$('primary-tabs').onclick=e=>{const b=e.target.closest('[data-group]');if(b){activeGroup=b.dataset.group;activeStatus='';page=1;render()}};
$('secondary-tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(b){activeStatus=b.dataset.status;page=1;render()}};
$('stage-filter').onchange=e=>{if(e.target.id==='f-stage')draftStage=e.target.value};
$('filter-form').onsubmit=e=>{e.preventDefault();applied={id:$('f-task').value.trim(),company:$('f-company').value.trim(),leader:$('f-leader').value.trim(),stage:draftStage,start:$('f-date-start').value,end:$('f-date-end').value};page=1;hideCompany();closeDatePicker();render()};
$('reset-filters').onclick=()=>{$('filter-form').reset();$('f-date-start').value='';$('f-date-end').value='';applied={};draftStage='';activeGroup='';activeStatus='';page=1;renderStages();updateDateRangeLabel();hideCompany();closeDatePicker();render()};
function hideCompany(){$('company-options').hidden=true;$('f-company').setAttribute('aria-expanded','false')}
function showCompany(){const query=$('f-company').value.trim(),names=[...new Set(tasks.map(t=>t.company))].filter(n=>n.includes(query));$('company-options').innerHTML='<button type="button" role="option" data-company="">全部</button>'+names.map(n=>'<button type="button" role="option" data-company="'+esc(n)+'">'+esc(n)+'</button>').join('')+(!names.length?'<span class="muted" style="display:block;padding:8px">无匹配客户</span>':'');$('company-options').hidden=false;$('f-company').setAttribute('aria-expanded','true')}

$('company-options').onkeydown=e=>{const options=[...$('company-options').querySelectorAll('button')],i=options.indexOf(document.activeElement);if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();options[(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length]?.focus()}};
document.addEventListener('click',e=>{if(!e.target.closest('.combo'))hideCompany()});
$('prev-page').onclick=()=>{page--;render()};$('next-page').onclick=()=>{page++;render()};$('page-buttons').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=+b.dataset.page;render()}};$('page-size').onchange=()=>{pageSize=+$('page-size').value;page=1;render()};$('page-jump').onchange=()=>{page=Math.max(1,Math.min(Number($('page-jump').value)||1,Number($('page-jump').max)));render()};
$('modal-close').onclick=closeModal;$('task-modal').onclick=e=>{if(e.target===$('task-modal'))closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('task-modal').classList.contains('show'))closeModal();closeDatePicker();hideCompany()}if(e.key==='Tab'&&$('task-modal').classList.contains('show')){const controls=[...$('task-modal').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&x.getClientRects().length),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let dateDraftStart="",dateDraftEnd="",calendarMonth=new Date(2026,9,1);
const dateText=(year,month,day)=>year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
function updateDateRangeLabel(){const start=$("f-date-start").value,end=$("f-date-end").value,has=Boolean(start&&end);$("date-range-label").textContent=has?start+" ~ "+end:"请选择日期范围";$("date-range-label").classList.toggle("placeholder",!has);$("date-range-clear").hidden=!has}
function renderCalendars(){
 $("date-selection-tip").textContent=dateDraftStart&&!dateDraftEnd?"请选择结束日期":"请选择开始日期和结束日期";
 $("date-draft-label").textContent=dateDraftStart?dateDraftStart+" ~ "+(dateDraftEnd||"结束日期"):"尚未选择日期";$("date-apply").disabled=!(dateDraftStart&&dateDraftEnd);
 $("calendar-pair").innerHTML=[0,1].map(offset=>{
 const d=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+offset,1),year=d.getFullYear(),month=d.getMonth(),count=new Date(year,month+1,0).getDate(),leading=(d.getDay()+6)%7;
 return '<div class="calendar-month"><h3>'+year+'年 '+(month+1)+'月</h3><div class="calendar-grid">'+["一","二","三","四","五","六","日"].map(w=>'<span class="weekday">'+w+'</span>').join("")+'<span class="blank"></span>'.repeat(leading)+Array.from({length:count},(_,i)=>{const value=dateText(year,month,i+1),edge=value===dateDraftStart||value===dateDraftEnd,between=dateDraftStart&&dateDraftEnd&&value>dateDraftStart&&value<dateDraftEnd;return '<button type="button" class="day '+(edge?"edge":between?"between":"")+'" data-date="'+value+'" aria-label="'+value+'">'+(i+1)+'</button>'}).join("")+'</div></div>'
 }).join("");
 document.querySelectorAll("#calendar-pair .day").forEach(button=>button.onclick=()=>{const value=button.dataset.date;if(!dateDraftStart||dateDraftEnd||value<dateDraftStart){dateDraftStart=value;dateDraftEnd=""}else{dateDraftEnd=value}renderCalendars();document.querySelector('#calendar-pair [data-date="'+value+'"]')?.focus()})
}
function positionDatePicker(){if($("date-picker").hidden)return;const box=$("date-range-trigger").getBoundingClientRect(),picker=$("date-picker");picker.style.left=Math.max(12,Math.min(box.left,window.innerWidth-picker.offsetWidth-12))+"px";picker.style.top=(box.bottom+8+picker.offsetHeight<=window.innerHeight?box.bottom+8:Math.max(12,box.top-picker.offsetHeight-8))+"px"}
function openDatePicker(){dateDraftStart=$("f-date-start").value;dateDraftEnd=$("f-date-end").value;if(dateDraftStart){const parts=dateDraftStart.split("-").map(Number);calendarMonth=new Date(parts[0],parts[1]-1,1)}renderCalendars();$("date-picker").hidden=false;$("date-range-trigger").setAttribute("aria-expanded","true");positionDatePicker()}
function closeDatePicker(){$("date-picker").hidden=true;$("date-range-trigger").setAttribute("aria-expanded","false")}
$("date-range-trigger").onclick=()=>{$("date-picker").hidden?openDatePicker():closeDatePicker()};
$("date-range-clear").onclick=()=>{$("f-date-start").value="";$("f-date-end").value="";updateDateRangeLabel();closeDatePicker()};
$("date-prev").onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendars()};
$("date-next").onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendars()};
$("date-cancel").onclick=()=>{closeDatePicker();$("date-range-trigger").focus()};
$("date-apply").onclick=()=>{if(!dateDraftStart||!dateDraftEnd)return;$("f-date-start").value=dateDraftStart;$("f-date-end").value=dateDraftEnd;updateDateRangeLabel();closeDatePicker();$("date-range-trigger").focus()};
document.addEventListener("click",event=>{if(!$("date-picker").hidden&&!event.composedPath().includes($("date-picker"))&&!document.querySelector(".range-control").contains(event.target))closeDatePicker()});

window.addEventListener('resize',positionDatePicker);window.addEventListener('scroll',positionDatePicker,true);
function syncTaskColumns(){const viewport=document.querySelector('.table-scroll'),table=viewport.querySelector('.task-table'),heads=[...table.querySelectorAll('th')],bar=$('table-horizontal');if(!heads.length)return;table.style.setProperty('--task-min-width',[...table.querySelectorAll('col')].reduce((sum,col)=>sum+parseFloat(col.style.width),0)+'px');const first=heads[0].getBoundingClientRect().width,left=first+heads[1].getBoundingClientRect().width,action=heads.at(-1).getBoundingClientRect().width,right=action+heads.at(-2).getBoundingClientRect().width;table.style.setProperty('--customer-left',first+'px');table.style.setProperty('--action-width',action+'px');bar.style.marginLeft=left+'px';bar.style.marginRight=right+'px';const max=viewport.scrollWidth-viewport.clientWidth;bar.hidden=max<=1||viewport.clientWidth<=left+right+40;$('horizontal-spacer').style.width=(bar.clientWidth+max)+'px';bar.scrollLeft=viewport.scrollLeft}
document.querySelector('.table-scroll').addEventListener('scroll',()=>{const viewport=document.querySelector('.table-scroll');if(Math.abs($('table-horizontal').scrollLeft-viewport.scrollLeft)>1)$('table-horizontal').scrollLeft=viewport.scrollLeft});

new ResizeObserver(syncTaskColumns).observe(document.querySelector('.table-scroll'));
renderStages();render();updateDateRangeLabel();
