<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监督合格通知书</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary:#2563eb; --primary-soft:#eff6ff; --bg:#f4f7fb; --panel:#fff; --text:#172033; --muted:#64748b; --border:#e2e8f0; --danger:#dc2626; --success:#059669; --warning:#d97706; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif; font-size:13px; }
        button,input,select { font:inherit; }
        button { cursor:pointer; }
        .page { min-width:1100px; padding:24px; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
        .page-title { display:flex; align-items:center; gap:10px; color:#0f172a; font-size:22px; font-weight:700; }
        .page-title i { color:var(--primary); }
        .page-subtitle { color:var(--muted); margin-top:6px; }
        .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 2px 8px rgba(15,23,42,.04); margin-bottom:16px; }
        .filter-panel { padding:18px 20px; }
        .filter-grid { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:16px 18px; align-items:end; }
        .filter-item { display:flex; flex-direction:column; gap:7px; }
        .filter-item label { color:#475569; font-size:12px; font-weight:600; }
        .filter-item input,.filter-item select { width:100%; min-height:36px; padding:0 11px; border:1px solid #cbd5e1; border-radius:6px; outline:none; background:#fff; color:#334155; }
        .filter-item input:focus,.filter-item select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
        .filter-actions { display:flex; justify-content:flex-end; gap:8px; grid-column:1/-1; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:72px; height:34px; padding:0 14px; border:1px solid transparent; border-radius:6px; background:#fff; color:#334155; font-size:13px; font-weight:500; white-space:nowrap; transition:.15s ease; }
        .btn-primary { background:var(--primary); color:#fff; } .btn-primary:hover { background:#1d4ed8; }
        .btn-default { background:#fff; border-color:#cbd5e1; color:#475569; } .btn-default:hover { background:#f8fafc; border-color:#94a3b8; }
        .btn-danger { color:#b91c1c; background:#fff; border-color:#fecaca; } .btn-danger:hover { background:#fef2f2; }
        .btn-sm { min-width:auto; height:28px; padding:0 10px; font-size:12px; }
        .toolbar { min-height:56px; padding:0 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
        .tabs { display:flex; align-self:stretch; gap:20px; }
        .tab { display:flex; align-items:center; gap:7px; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; font-weight:600; }
        .tab.active { color:var(--primary); border-bottom-color:var(--primary); }
        .toolbar-right { display:flex; align-items:center; gap:10px; color:var(--muted); }
        .toolbar-right strong { color:#0f172a; }
        .table-scroll-container { overflow-x:auto; position:relative; width:100%; }
        table { width:100%; border-collapse:collapse; }
        .tbl { width:100%; min-width:1514px; border-collapse:collapse; table-layout:fixed; font-size:12px; }
        .tbl th { box-sizing:border-box; padding:10px 12px; background:#f9fafb; color:#374151; text-align:left; font-size:12px; font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap; }
        .tbl td { box-sizing:border-box; padding:10px 12px; border-bottom:1px solid #f3f4f6; color:#374151; vertical-align:middle; white-space:nowrap; }
        .tbl tr:hover td { background:#fafafa; }
        .check-cell { text-align:center; }
        .row-check { width:14px; height:14px; accent-color:var(--primary); cursor:pointer; }
        .row-check:disabled { cursor:not-allowed; opacity:.45; }
        .col-select { position:sticky; left:0; z-index:2; width:44px; min-width:44px; max-width:44px; background:#fff; }
        .col-notice { position:sticky; left:44px; z-index:2; width:180px; min-width:180px; max-width:180px; background:#fff; }
        .col-company { position:sticky; left:224px; z-index:2; width:220px; min-width:220px; max-width:220px; background:#fff; }
        .col-status { position:sticky; right:260px; z-index:2; width:110px; min-width:110px; max-width:110px; background:#fff; }
        .col-action { position:sticky; right:0; z-index:2; width:260px; min-width:260px; max-width:260px; background:#fff; }
        thead .col-select, thead .col-notice, thead .col-company, thead .col-status, thead .col-action { z-index:3; background:#f9fafb; }
        .tbl tr:hover .col-select, .tbl tr:hover .col-notice, .tbl tr:hover .col-company, .tbl tr:hover .col-status, .tbl tr:hover .col-action { background:#fafafa; }
        .company { color:#0f172a; font-weight:600; }
        .notice-link { color:var(--primary); cursor:pointer; font-weight:600; }
        .muted-id { color:#94a3b8; }
        .field-tag,.status { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:4px; font-size:12px; font-weight:600; }
        .field-qms { color:#1d4ed8; background:#dbeafe; } .field-ems { color:#047857; background:#d1fae5; } .field-ohs { color:#be185d; background:#fce7f3; } .field-fsms { color:#92400e; background:#fef3c7; }
        .status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
        .status-issuing { color:#2563eb; background:#dbeafe; } .status-issued { color:#047857; background:#d1fae5; } .status-pushed { color:#15803d; background:#dcfce7; } .status-failed { color:#b91c1c; background:#fee2e2; }
        .actions { display:flex; align-items:center; gap:8px; }
        .action { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:auto; height:28px; padding:0 4px; border:0; border-radius:0; background:transparent; color:var(--primary); font-size:13px; font-weight:500; white-space:nowrap; }
        .action:hover { background:transparent; color:#1d4ed8; text-decoration:underline; } .action.success { color:var(--primary); } .action.danger { color:var(--primary); }
        .action:disabled { color:#94a3b8; cursor:not-allowed; background:transparent; }
        .pagination { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:12px 16px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
        .pagination select { width:90px; height:30px; }
        .pager-btn { min-width:30px; height:30px; padding:0 8px; }
        .empty { padding:56px 20px; text-align:center; color:#94a3b8; } .empty i { display:block; margin-bottom:12px; font-size:36px; }
        .mask { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(15,23,42,.48); z-index:20; }
        .mask.show { display:flex; }
        .dialog { width:min(520px,100%); background:#fff; border-radius:8px; box-shadow:0 18px 50px rgba(15,23,42,.2); overflow:hidden; }
        .dialog.large { width:min(900px,100%); }
        .dialog.log-dialog { width:min(620px,100%); }
        .dialog.push-dialog { width:min(460px,100%); }
        .dialog.retry-dialog { width:min(460px,100%); }
        .dialog-header,.dialog-footer { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
        .dialog-footer { justify-content:flex-end; gap:8px; border-top:1px solid var(--border); border-bottom:0; }
        .dialog-title { font-size:16px; font-weight:700; } .close { border:0; background:transparent; color:#64748b; font-size:18px; }
        .dialog-body { padding:20px; } .confirm-icon { width:48px; height:48px; display:grid; place-items:center; margin:0 auto 14px; border-radius:50%; background:#dbeafe; color:var(--primary); font-size:22px; }
        .confirm-title { text-align:center; font-size:17px; font-weight:700; } .confirm-message { margin:12px 0 4px; color:var(--muted); line-height:1.7; text-align:center; }
        .push-dialog .dialog-body { padding:24px 28px 22px; }
        .push-dialog .confirm-title { margin-bottom:14px; }
        .retry-dialog .dialog-body { padding:24px 28px 22px; }
        .retry-dialog .confirm-title { margin-bottom:10px; }
        .confirm-summary { width:min(320px,100%); margin:0 auto; color:#64748b; font-size:14px; line-height:1.8; text-align:left; }
        .confirm-summary strong { color:#475569; font-weight:700; }
        .log-layout { display:flex; align-items:flex-start; gap:16px; padding:8px 8px 4px; }
        .log-icon { width:48px; height:48px; display:grid; place-items:center; flex:0 0 auto; border-radius:10px; background:#fef2f2; color:#dc2626; font-size:22px; }
        .log-title { color:#111827; font-size:20px; font-weight:700; line-height:1.3; }
        .log-message { margin-top:10px; color:#475569; font-size:14px; line-height:1.65; }
        .log-box { margin-top:12px; max-height:180px; overflow:auto; padding:10px 12px; background:#f8fafc; border:1px solid var(--border); border-radius:6px; color:#64748b; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
        .preview-body { height:min(650px,70vh); padding:20px; overflow:auto; background:#f8fafc; text-align:center; } .preview-body img { max-width:100%; box-shadow:0 3px 16px rgba(15,23,42,.14); }
        @media (max-width:1200px) { .filter-grid { grid-template-columns:repeat(3,minmax(180px,1fr)); } }
    </style>
</head>
<body>
<main class="page">
    <header class="page-header"><div><div class="page-title"><i class="fa-solid fa-file-circle-check"></i>监督合格通知书</div><div class="page-subtitle">管理监督合格通知书签发及客户推送</div></div></header>
    <section class="panel filter-panel">
        <div class="filter-grid">
            <div class="filter-item"><label>通知书编号</label><input id="keyword" placeholder="支持编号模糊搜索"></div>
            <div class="filter-item"><label>客户名称</label><input id="customer" placeholder="请输入客户名称"></div>
            <div class="filter-item"><label>认证领域</label><select id="field"><option value="">全部</option><option value="QMS">QMS（质量管理体系）</option><option value="EMS">EMS（环境管理体系）</option><option value="OHS">OHSMS（职业健康安全管理体系）</option><option value="FSMS">FSMS（食品安全管理体系）</option></select></div>
            <div class="filter-item"><label>状态</label><select id="statusFilter"><option value="">全部</option><option value="issuing">签发中</option><option value="issued">已签发</option><option value="pushed">已推送</option><option value="failed">签发失败</option></select></div>
            <div class="filter-actions"><button class="btn btn-default" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i>重置</button><button class="btn btn-primary" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i>查询</button></div>
        </div>
    </section>
    <section class="panel">
        <div class="toolbar"><div class="tabs"><div class="tab active" data-tab="all" onclick="setTab('all')"><i class="fa-solid fa-list"></i>全部</div><div class="tab" data-tab="issuing" onclick="setTab('issuing')"><i class="fa-solid fa-spinner"></i>签发中</div><div class="tab" data-tab="issued" onclick="setTab('issued')"><i class="fa-solid fa-circle-check"></i>已签发</div><div class="tab" data-tab="pushed" onclick="setTab('pushed')"><i class="fa-solid fa-paper-plane"></i>已推送</div><div class="tab" data-tab="failed" onclick="setTab('failed')"><i class="fa-solid fa-triangle-exclamation"></i>签发失败</div></div><div class="toolbar-right"><button class="btn btn-default" onclick="batchDownload()"><i class="fa-solid fa-download"></i>批量下载</button><button class="btn btn-primary" onclick="batchPush()"><i class="fa-solid fa-paper-plane"></i>批量推送</button><span>当前列表 <strong id="visibleCount">0</strong> 条</span></div></div>
        <div class="table-scroll-container"><table class="tbl"><thead><tr><th class="col-select check-cell"><input class="row-check" id="checkAll" type="checkbox" onclick="toggleCheckAll(this)"></th><th class="col-notice" style="width:180px">监督合格通知书编号</th><th class="col-company" style="width:220px">客户名称</th><th style="width:150px">归属机构</th><th style="width:110px">认证领域</th><th style="width:130px">审核开始日期</th><th style="width:130px">审核结束日期</th><th style="width:160px">认证决定提交时间</th><th class="col-status" style="width:110px">状态</th><th class="col-action" style="width:260px">操作</th></tr></thead><tbody id="tableBody"></tbody></table><div class="empty" id="empty" style="display:none"><i class="fa-regular fa-folder-open"></i>暂无符合条件的数据</div></div>
        <div class="pagination"><span>共 <strong id="total">0</strong> 条</span><button class="btn btn-default pager-btn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button><span id="pageInfo">1 / 1</span><button class="btn btn-default pager-btn" onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button><select id="pageSize" onchange="changePageSize()"><option value="10">10 行</option><option value="20">20 行</option></select></div>
    </section>
</main>
<div class="mask" id="pushModal"><div class="dialog push-dialog"><div class="dialog-header"><div class="dialog-title">确认推送</div><button class="close" onclick="closeModal('pushModal')"><i class="fa-solid fa-xmark"></i></button></div><div class="dialog-body"><div class="confirm-icon"><i class="fa-solid fa-paper-plane"></i></div><div class="confirm-title">确认推送监督合格通知书？</div><div class="confirm-message" id="pushMessage"></div></div><div class="dialog-footer"><button class="btn btn-default" onclick="closeModal('pushModal')">取消</button><button class="btn btn-primary" onclick="confirmPush()"><i class="fa-solid fa-paper-plane"></i>确认推送</button></div></div></div>
<div class="mask" id="logModal"><div class="dialog log-dialog"><div class="dialog-body"><div class="log-layout"><div class="log-icon"><i class="fa-solid fa-file-lines"></i></div><div><div class="log-title">返回失败日志</div><div class="log-message" id="logMessage"></div><div class="log-box" id="logContent"></div></div></div></div><div class="dialog-footer"><button class="btn btn-default" onclick="closeModal('logModal')">关闭</button></div></div></div>
<div class="mask" id="previewModal"><div class="dialog large"><div class="dialog-header"><div class="dialog-title"><i class="fa-solid fa-eye"></i>监督合格通知书预览</div><button class="close" onclick="closeModal('previewModal')"><i class="fa-solid fa-xmark"></i></button></div><div class="preview-body"><img id="previewImage" src="https://mahongxiao.github.io/MyHtml/%E4%BD%93%E7%B3%BB/%E8%AF%81%E5%90%8E/%E7%9B%91%E7%9D%A3%E5%90%88%E6%A0%BC%E9%80%9A%E7%9F%A5%E4%B9%A6%E5%9B%BE%E7%89%87_u321.png" alt="监督合格通知书"></div><div class="dialog-footer"><button class="btn btn-default" onclick="closeModal('previewModal')">关闭</button><button class="btn btn-primary" onclick="downloadCurrent()"><i class="fa-solid fa-download"></i>下载</button></div></div></div>
<div class="mask" id="retryModal"><div class="dialog retry-dialog"><div class="dialog-header"><div class="dialog-title">确认重新签发</div><button class="close" onclick="closeModal('retryModal')"><i class="fa-solid fa-xmark"></i></button></div><div class="dialog-body"><div class="confirm-icon" style="background:#fef3c7;color:#d97706"><i class="fa-solid fa-rotate-right"></i></div><div class="confirm-title">确认重新签发该通知书？</div><div class="confirm-message" id="retryMessage"></div></div><div class="dialog-footer"><button class="btn btn-default" onclick="closeModal('retryModal')">取消</button><button class="btn btn-primary" onclick="confirmRetry()"><i class="fa-solid fa-rotate-right"></i>重新签发</button></div></div></div>
<div id="toast" style="position:fixed;right:24px;bottom:24px;display:none;padding:12px 18px;background:#0f172a;color:#fff;border-radius:6px;box-shadow:0 8px 24px #0003;z-index:30"></div>
<script>
const rows=[
 {id:'210026Q3Q03143',customer:'华锐精密机械制造有限公司',org:'广州中心',field:'QMS',start:'2026-03-30',end:'2026-03-31',submit:'2026-04-02 09:36',state:'issuing'},
 {id:'210026Q3Q03144',customer:'华锐精密机械制造有限公司',org:'广州中心',field:'QMS',start:'2026-03-30',end:'2026-03-30',submit:'2026-04-02 10:12',state:'issued'},
 {id:'210026Q3Q03145',customer:'华锐精密机械制造有限公司',org:'广州中心',field:'OHS',start:'2026-03-30',end:'2026-04-01',submit:'2026-04-02 11:08',state:'pushed'},
 {id:'210026Q3Q03146',customer:'安捷通运物流仓储有限公司',org:'广州中心',field:'QMS',start:'2026-03-30',end:'2026-03-30',submit:'2026-04-03 09:21',state:'failed',logMessage:'CA平台返回失败：监督合格通知书申请报文校验未通过，通知书附件字段 noticeAttachment 缺失。',log:'{"code":"NOTICE_422","message":"noticeAttachment is required","requestId":"NT202604031126008"}'},
 {id:'210026Q3Q03147',customer:'盛达新材化工有限公司',org:'广州中心',field:'EMS',start:'2026-03-30',end:'2026-03-30',submit:'2026-04-03 13:15',state:'issued'},
 {id:'210026Q3Q03148',customer:'科瑞智联新能源科技有限公司',org:'广州中心',field:'OHS',start:'2026-03-30',end:'2026-03-30',submit:'2026-04-04 08:45',state:'pushed'},
 {id:'210026Q3Q03149',customer:'锦程织造服饰有限公司',org:'广州中心',field:'FSMS',start:'2026-03-30',end:'2026-03-30',submit:'2026-04-04 14:22',state:'issuing'},
 {id:'210026Q3Q03150',customer:'康泰瑞康医疗器械有限公司',org:'广州中心',field:'QMS',start:'2026-04-05',end:'2026-04-06',submit:'2026-04-07 09:18',state:'issued'},
 {id:'210026Q3Q03151',customer:'宏远精工五金制品有限公司',org:'广州中心',field:'EMS',start:'2026-04-05',end:'2026-04-05',submit:'2026-04-07 14:06',state:'pushed'},
 {id:'210026Q3Q03152',customer:'新锐食品科技有限公司',org:'广州中心',field:'FSMS',start:'2026-04-06',end:'2026-04-07',submit:'2026-04-08 10:27',state:'failed',logMessage:'CA平台返回失败：监督合格通知书申请报文校验未通过，通知书附件字段 noticeAttachment 缺失。',log:'{"code":"NOTICE_422","message":"noticeAttachment is required","requestId":"NT202604081027052"}'}
];
const stateText={issuing:'签发中',issued:'已签发',pushed:'已推送',failed:'签发失败'}, stateOrder={issuing:1,issued:2,pushed:3,failed:4}; let tab='all',page=1,size=10,pushId=null,retryId=null,currentPreviewId=null; const selectedIds=new Set();
function fieldClass(field){return 'field-'+({QMS:'qms',EMS:'ems',OHS:'ohs',FSMS:'fsms'}[field]||'qms');}
function getRows(){const key=document.getElementById('keyword').value.trim(), customer=document.getElementById('customer').value.trim(), field=document.getElementById('field').value, status=document.getElementById('statusFilter').value; return rows.filter(r=>(tab==='all'||r.state===tab)&&(!key||r.id.includes(key))&&(!customer||r.customer.includes(customer))&&(!field||r.field===field)&&(!status||r.state===status)).sort((a,b)=>(stateOrder[a.state]-stateOrder[b.state])||a.submit.localeCompare(b.submit));}
function render(){const data=getRows(), start=(page-1)*size, pageRows=data.slice(start,start+size), tbody=document.getElementById('tableBody'); document.getElementById('total').textContent=data.length; document.getElementById('visibleCount').textContent=data.length; document.getElementById('pageInfo').textContent=`${data.length? page:1} / ${Math.max(1,Math.ceil(data.length/size))}`; document.getElementById('empty').style.display=data.length?'none':'block'; tbody.innerHTML=pageRows.map(r=>{const selectable=['issued','pushed'].includes(r.state), checked=selectedIds.has(r.id)?'checked':''; const previewButton=['issued','pushed'].includes(r.state)?`<button class="action" onclick="preview('${r.id}')"><i class="fa-solid fa-eye"></i>预览</button>`:''; return `<tr><td class="col-select check-cell"><input class="row-check" type="checkbox" value="${r.id}" ${checked} ${selectable?'':'disabled'} onclick="toggleSelect(this)"></td><td class="col-notice">${r.state==='issuing'?'<span class="muted-id">-</span>':`<span class="notice-link" onclick="preview('${r.id}')">${r.id}</span>`}</td><td class="col-company company">${r.customer}</td><td>${r.org}</td><td><span class="field-tag ${fieldClass(r.field)}">${r.field}</span></td><td>${r.start}</td><td>${r.end}</td><td>${r.submit}</td><td class="col-status"><span class="status status-${r.state}">${stateText[r.state]}</span></td><td class="col-action"><div class="actions">${previewButton}${r.state==='issued'?`<button class="action success" onclick="push('${r.id}')"><i class="fa-solid fa-paper-plane"></i>推送</button>`:''}${r.state==='failed'?`<button class="action danger" onclick="showLog('${r.id}')"><i class="fa-solid fa-file-lines"></i>查看日志</button><button class="action" onclick="retry('${r.id}')"><i class="fa-solid fa-rotate-right"></i>重新签发</button>`:''}</div></td></tr>`;}).join('');syncCheckAll(pageRows);}
function setTab(next){tab=next;page=1;document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===next));render();}
function applyFilters(){page=1;render();toast('筛选条件已应用');} function resetFilters(){['keyword','customer','field','statusFilter'].forEach(id=>document.getElementById(id).value='');tab='all';page=1;document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab==='all'));render();}
function changePage(delta){const total=Math.max(1,Math.ceil(getRows().length/size));page=Math.min(total,Math.max(1,page+delta));render();} function changePageSize(){size=Number(document.getElementById('pageSize').value);page=1;render();}
function openModal(id){document.getElementById(id).classList.add('show');} function closeModal(id){document.getElementById(id).classList.remove('show');}
function toggleSelect(checkbox){checkbox.checked?selectedIds.add(checkbox.value):selectedIds.delete(checkbox.value);syncCheckAll(getRows().slice((page-1)*size,page*size));}
function toggleCheckAll(checkbox){getRows().slice((page-1)*size,page*size).filter(r=>['issued','pushed'].includes(r.state)).forEach(r=>checkbox.checked?selectedIds.add(r.id):selectedIds.delete(r.id));render();}
function syncCheckAll(pageRows){const box=document.getElementById('checkAll');if(!box)return;const selectable=pageRows.filter(r=>['issued','pushed'].includes(r.state));const checked=selectable.filter(r=>selectedIds.has(r.id));box.checked=selectable.length>0&&checked.length===selectable.length;box.indeterminate=checked.length>0&&checked.length<selectable.length;}
function preview(id){currentPreviewId=id;document.getElementById('previewImage').alt=`监督合格通知书 ${id}`;openModal('previewModal');}
function downloadCurrent(){if(!currentPreviewId){toast('请先预览通知书');return;}toast(`已下载监督合格通知书：${currentPreviewId}`);}
function push(id){const r=rows.find(x=>x.id===id);if(!r||r.state!=='issued'){toast('仅已签发的通知书可以推送');return;}pushId=id;document.getElementById('pushMessage').innerHTML=`<div class="confirm-summary"><div>通知书编号：<strong>${r.id}</strong></div><div>客户：<strong>${r.customer}</strong></div></div>`;openModal('pushModal');}
function confirmPush(){const r=rows.find(x=>x.id===pushId);if(r)r.state='pushed';closeModal('pushModal');render();toast('推送成功，状态已更新为已推送');}
function batchPush(){const targets=rows.filter(r=>selectedIds.has(r.id)&&r.state==='issued');if(!targets.length){toast('请选择已签发的通知书进行批量推送');return;}targets.forEach(r=>{r.state='pushed';selectedIds.delete(r.id);});render();toast(`已批量推送 ${targets.length} 份监督合格通知书`);}
function batchDownload(){const targets=rows.filter(r=>selectedIds.has(r.id)&&['issued','pushed'].includes(r.state));if(!targets.length){toast('请选择已签发或已推送的通知书进行批量下载');return;}toast(`已批量下载 ${targets.length} 份监督合格通知书`);}
function showLog(id){const r=rows.find(x=>x.id===id);if(!r)return;let detail=r.log||'{"code":"NOTICE_422","message":"noticeAttachment is required"}';try{detail=JSON.stringify(JSON.parse(detail),null,2);}catch(e){}document.getElementById('logMessage').textContent=r.logMessage||'CA平台返回失败：监督合格通知书申请报文校验未通过。';document.getElementById('logContent').textContent=detail;openModal('logModal');}
function retry(id){const r=rows.find(x=>x.id===id);if(!r||r.state!=='failed')return;retryId=id;document.getElementById('retryMessage').textContent=`${r.customer}的通知书将重新进入签发流程。`;openModal('retryModal');}
function confirmRetry(){const r=rows.find(x=>x.id===retryId);if(r)r.state='issuing';closeModal('retryModal');render();toast('已重新发起签发，状态更新为签发中');}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2200);}
document.addEventListener('DOMContentLoaded',render); document.querySelectorAll('.mask').forEach(mask=>mask.addEventListener('click',e=>{if(e.target===mask)mask.classList.remove('show');}));
</script>
</body>
</html>
