let dateDraftStart="",dateDraftEnd="",calendarMonth=new Date(2026,8,1);
const dateText=(year,month,day)=>year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
function updateDateRangeLabel(){const start=$("f-date-start").value,end=$("f-date-end").value,has=Boolean(start&&end);$("date-range-label").textContent=has?start+" ~ "+end:"开始日期 ~ 结束日期";$("date-range-label").classList.toggle("placeholder",!has);$("date-range-clear").hidden=!has}
function renderCalendars(){
 $("date-selection-tip").textContent=dateDraftStart&&!dateDraftEnd?"请选择结束日期":"请选择开始日期和结束日期";
 $("date-draft-label").textContent=dateDraftStart?dateDraftStart+" ~ "+(dateDraftEnd||"结束日期"):"尚未选择日期";$("date-apply").disabled=!(dateDraftStart&&dateDraftEnd);
 $("calendar-pair").innerHTML=[0,1].map(offset=>{
 const d=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+offset,1),year=d.getFullYear(),month=d.getMonth(),count=new Date(year,month+1,0).getDate(),leading=(d.getDay()+6)%7;
 return '<div class="calendar-month"><h3>'+year+'年 '+(month+1)+'月</h3><div class="calendar-grid">'+["一","二","三","四","五","六","日"].map(w=>'<span class="weekday">'+w+'</span>').join("")+'<span class="blank"></span>'.repeat(leading)+Array.from({length:count},(_,i)=>{const value=dateText(year,month,i+1),edge=value===dateDraftStart||value===dateDraftEnd,between=dateDraftStart&&dateDraftEnd&&value>dateDraftStart&&value<dateDraftEnd;return '<button type="button" class="day '+(edge?"edge":between?"between":"")+'" data-date="'+value+'" aria-label="'+value+'">'+(i+1)+'</button>'}).join("")+'</div></div>'
 }).join("");
 document.querySelectorAll("#calendar-pair .day").forEach(button=>button.onclick=()=>{const value=button.dataset.date;if(!dateDraftStart||dateDraftEnd||value<dateDraftStart){dateDraftStart=value;dateDraftEnd=""}else{dateDraftEnd=value}renderCalendars();document.querySelector('#calendar-pair [data-date="'+value+'"]')?.focus()})
}
function positionDatePicker(){if($("date-picker").hidden)return;const box=$("date-range-trigger").getBoundingClientRect(),picker=$("date-picker");picker.style.left=Math.max(12,Math.min(box.left,window.innerWidth-picker.offsetWidth-12))+"px";picker.style.top=(box.bottom+8+picker.offsetHeight<=window.innerHeight?box.bottom+8:Math.max(12,box.top-picker.offsetHeight-8))+"px"}
function openDatePicker(){dateDraftStart=$("f-date-start").value;dateDraftEnd=$("f-date-end").value;if(dateDraftStart){const parts=dateDraftStart.split("-").map(Number);calendarMonth=new Date(parts[0],parts[1]-1,1)}renderCalendars();$("date-picker").hidden=false;$("date-range-trigger").setAttribute("aria-expanded","true");positionDatePicker()}
function closeDatePicker(){$("date-picker").hidden=true;$("date-range-trigger").setAttribute("aria-expanded","false")}
$("date-range-trigger").onclick=()=>{$("date-picker").hidden?openDatePicker():closeDatePicker()};

$("date-prev").onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendars()};
$("date-next").onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendars()};
$("date-cancel").onclick=()=>{closeDatePicker();$("date-range-trigger").focus()};
$("date-apply").onclick=()=>{if(!dateDraftStart||!dateDraftEnd)return;$("f-date-start").value=dateDraftStart;$("f-date-end").value=dateDraftEnd;updateDateRangeLabel();closeDatePicker();$("date-range-trigger").focus()};

updateDateRangeLabel();

let planOpener=null;
function openPlan(){
 planOpener=document.activeElement;
 if(!$("plan-frame").srcdoc){const bytes=Uint8Array.from(atob(embeddedPlanHtml),c=>c.charCodeAt(0));$("plan-frame").srcdoc=new TextDecoder("utf-8").decode(bytes)}
 $("plan-modal").classList.add("show");$("plan-close").focus()
}
function closePlan(){$("plan-modal").classList.remove("show");if(planOpener?.isConnected)planOpener.focus()}
$("view-plan").onclick=openPlan;$("plan-close").onclick=closePlan;$("plan-done").onclick=closePlan;
$("plan-download").onclick=()=>{const bytes=Uint8Array.from(atob(embeddedPlanPdf),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download="审核计划.pdf";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};


let projectTooltipAnchor=null;
function showProjectTooltip(anchor){
 const numbers=JSON.parse(anchor.dataset.projects);if(numbers.length<2)return;
 const tip=$("project-tooltip");projectTooltipAnchor=anchor;tip.innerHTML="<strong>全部项目（"+numbers.length+"）</strong>"+numbers.map(number=>"<div>"+esc(number)+"</div>").join("");tip.hidden=false;anchor.setAttribute("aria-describedby","project-tooltip");
 const box=anchor.getBoundingClientRect();tip.style.left=Math.max(12,Math.min(box.left,window.innerWidth-tip.offsetWidth-12))+"px";tip.style.top=(box.bottom+6+tip.offsetHeight<=window.innerHeight?box.bottom+6:Math.max(12,box.top-tip.offsetHeight-6))+"px"
}
function hideProjectTooltip(){$("project-tooltip").hidden=true;projectTooltipAnchor?.removeAttribute("aria-describedby");projectTooltipAnchor=null}
document.addEventListener("mouseover",event=>{const anchor=event.target.closest(".project-preview");if(anchor&&anchor!==projectTooltipAnchor)showProjectTooltip(anchor)});
document.addEventListener("mouseout",event=>{if(projectTooltipAnchor&&!projectTooltipAnchor.contains(event.relatedTarget))hideProjectTooltip()});
document.addEventListener("focusin",event=>{const anchor=event.target.closest(".project-preview");if(anchor)showProjectTooltip(anchor)});
document.addEventListener("focusout",event=>{if(projectTooltipAnchor&&!projectTooltipAnchor.contains(event.relatedTarget))hideProjectTooltip()});
document.addEventListener("click",event=>{if(!event.target.closest(".project-preview"))hideProjectTooltip()});
document.addEventListener("keydown",event=>{if(event.key==="Escape")hideProjectTooltip()});
document.addEventListener("scroll",hideProjectTooltip,true);window.addEventListener("resize",hideProjectTooltip);

function updateStickyColumns(){
 const table=document.querySelector(".task-table"),cells=[...table.querySelectorAll("thead th")],widths=cells.map(cell=>cell.getBoundingClientRect().width);
 table.style.setProperty("--left-2",widths[0]+"px");
 table.style.setProperty("--left-3",(widths[0]+widths[1])+"px");
 table.style.setProperty("--right-2",widths[9]+"px");
 table.style.setProperty("--right-3",(widths[9]+widths[8])+"px");
}
renderTasks();
updateStickyColumns();
new ResizeObserver(updateStickyColumns).observe(document.querySelector(".task-table"));
</script></body></html>
